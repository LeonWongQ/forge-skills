[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-cli"
version = "1.2.1"
description = "Forge — modular AI engineering assistant CLI for task routing and validation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "jsonschema>=4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
forge = "forge_cli.cli:main"

[tool.setuptools.packages.find]
include = ["forge_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
