# TEMPLATE — DORMANT (not active in the current usage model)
# ============================================================
# This workflow is NEVER triggered in the normal forge usage model, where
# forge is a local toolkit deployed into consumer projects via directory
# junctions (see ../../../../install-link-forge.bat). In that model:
#   - `claudemd` (this toolkit's source dir) is not a git repository and is
#     not pushed to GitHub, so there is no repo for GitHub Actions to read.
#   - Even when junction-linked into a consumer project that IS a git repo,
#     GitHub only reads `.github/workflows/` at the REPOSITORY ROOT — it does
#     not discover workflows nested inside a junction-linked subtree.
#
# Local/commit-time checks are instead covered by:
#   - .pre-commit-config.yaml   (runs the validators on commit)
#   - scripts/run-local-checks.bat / .sh  (runs the full local check suite)
#
# ACTIVATING THIS WORKFLOW LATER:
# If forge is ever split into its own standalone git repository and pushed to
# GitHub, move this file to <repo-root>/.github/workflows/ and fix the TODOs
# below — they are known-broken because no one has run this file yet.
#
# TODO (fix before activating):
#   1. matrix `script:` paths use `forge/scripts/X.py` — must be the real path
#      relative to the repo root once this file lives there.
#   2. `python -m forge_cli` requires the package importable from the repo
#      root — either `pip install -e .` (pyproject declares the package) or
#      ensure __main__.py + sys.path is set up. (forge_cli/__main__.py exists
#      as of this fix, so `python -m forge_cli` works once importable.)
#   3. report paths are inconsistent: validate writes out/validate-... but
#      doctor writes .forge-skill/forge/out/doctor-... — unify to one location that
#      matches where scripts/check-report-freshness.py reads them.
# ============================================================

name: Validate Repository Metadata

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: validate-registry
            script: forge/scripts/validate-registry.py

          - name: check-module-paths
            script: forge/scripts/check-module-paths.py

          - name: check-cross-references
            script: forge/scripts/check-cross-references.py

          - name: validate-packs
            script: forge/scripts/validate-packs.py

          - name: check-pack-references
            script: forge/scripts/check-pack-references.py

          - name: check-route-regression
            script: forge/scripts/check-route-regression.py

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema click

      - name: Run ${{ matrix.name }}
        run: python ${{ matrix.script }}

  reports:
    name: report-freshness
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema click

      - name: Run forge validate
        run: >
          python -m forge_cli
          --root .
          validate
          --report out/validate-report.fresh.json

      - name: Run forge doctor
        run: >
          python -m forge_cli
          --root .
          doctor
          --report .forge-skill/forge/out/doctor-report.fresh.json

      - name: Check report freshness
        run: python forge/scripts/check-report-freshness.py

      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-reports
          path: |
            .forge-skill/forge/out/validate-report.fresh.json
            .forge-skill/forge/out/doctor-report.fresh.json
