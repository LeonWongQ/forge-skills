<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Overlay Configuration</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#172033;background:#edf2f7;--navy:#102a43;--blue:#1769aa;--muted:#6b7c93;--line:#dce5ee;--soft:#f6f9fc;--green:#087f5b;--amber:#b45309;--red:#b42318}*{box-sizing:border-box}body{margin:0}.shell{max-width:1320px;margin:auto;padding:28px 32px 48px}.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:28px;background:var(--navy);color:#fff;border-radius:10px;padding:22px 26px;margin-bottom:18px;box-shadow:0 8px 22px rgba(16,42,67,.16)}.hero-copy{max-width:760px}.eyebrow{font-size:12px;letter-spacing:1.5px;color:#a9d8ee;margin-bottom:5px}.hero h1{font-size:25px;margin:0}.sub{font-size:13px;color:var(--muted)}.hero .sub{color:#c4d4e2;margin-top:6px;max-width:720px}.hero-tools{display:flex;align-items:center;justify-content:flex-end;gap:9px}.link{display:inline-flex;align-items:center;justify-content:center;height:36px;color:#fff;text-decoration:none;border:1px solid #557189;border-radius:6px;padding:0 12px;font-size:12px;font-weight:600}.link:hover{background:rgba(255,255,255,.07)}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:start}.panel,.overlay{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 3px 12px rgba(16,42,67,.05)}.panel{padding:18px 20px}.config-panel{position:sticky;top:18px}.config-panel h2{font-size:16px;margin:0 0 5px;color:var(--navy)}.config-fields{display:grid;gap:10px;margin-top:16px}.filters{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px}select,input,textarea,button{font:inherit;border:1px solid #c8d4e1;border-radius:7px;padding:8px 10px;background:#fff;color:#172033}textarea{width:100%;min-height:180px;resize:vertical;line-height:1.5}textarea:disabled{background:#f7f9fb;color:#40566d}button{border:0;background:var(--blue);color:#fff;font-weight:600;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.48}.danger{background:var(--red)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px 15px}.stat span{display:block;color:var(--muted);font-size:11px}.stat b{display:block;margin-top:3px;color:var(--navy);font-size:22px}.overlays{display:grid;gap:14px}.overlay{padding:18px 20px}.overlay-head,.actions,.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.overlay-head{justify-content:space-between}.overlay-title{font-size:16px;font-weight:750;color:var(--navy)}.tag{display:inline-flex;background:#edf3f8;color:#40566d;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:650}.tag.ACTIVE,.tag.PUBLISHED{background:#e3f8ef;color:var(--green)}.tag.DRAFT,.tag.REVIEWED{background:#fff2d8;color:var(--amber)}.tag.DISABLED{background:#f1f3f5;color:#59636e}.meta{margin:9px 0 12px;color:var(--muted);font-size:12px}.content-label{display:block;margin:10px 0 6px;font-size:12px;font-weight:650;color:#40566d}.evaluation{margin-top:10px;padding:9px 11px;border-left:3px solid #80b7d8;background:#f2f8fc;color:#40566d;font-size:12px}.evaluation.error{border-left-color:var(--red);background:#fff5f5;color:var(--red)}.draft-hint{margin:10px 0;padding:9px 11px;border-left:3px solid var(--amber);background:#fff8e8;color:#75510b;font-size:12px}.message{min-height:20px;margin-top:10px}.error{color:var(--red)}.empty{text-align:center;padding:44px;color:var(--muted)}.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}.switch{position:relative;width:42px;height:24px;flex:0 0 auto}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#c8d4e1;border-radius:999px;cursor:pointer;transition:.2s}.slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}.switch input:checked+.slider{background:var(--green)}.switch input:checked+.slider:before{transform:translateX(18px)}
    @media(max-width:900px){.workspace{grid-template-columns:1fr}.config-panel{position:static}.filters{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}
    @media(max-width:760px){.shell{padding:14px 10px 28px}.hero{grid-template-columns:1fr;gap:17px;padding:20px}.hero-tools{display:grid;grid-template-columns:1fr;width:100%;gap:8px}.link{width:100%}.filters{grid-template-columns:1fr}.overlay-head{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<main class="shell">
  <header class="hero">
    <div class="hero-copy">
      <div class="eyebrow" data-i18n="overlayPageEyebrow"></div>
      <h1 data-i18n="overlayPageTitle"></h1>
      <div class="sub" data-i18n="overlayPageSubtitle"></div>
    </div>
    <div class="hero-tools">
      <a class="link" href="/" data-i18n="reviewPage"></a>
      <a class="link" href="/versions" data-i18n="summaryVersionsPage"></a>
    </div>
  </header>
  <div class="workspace">
    <section>
      <section class="panel">
        <div class="filters">
          <select id="project" aria-label="Project"></select>
          <select id="skill" aria-label="Skill"></select>
          <select id="status" aria-label="Overlay status"></select>
          <button id="refresh" data-i18n="refreshOverlays"></button>
        </div>
        <div id="message" class="message sub"></div>
      </section>
      <section id="stats" class="stats"></section>
      <section id="overlays" class="overlays"></section>
    </section>
    <aside class="panel config-panel">
      <h2 data-i18n="llmConfig"></h2>
      <div class="sub" data-i18n="llmConfigNote"></div>
      <div class="config-fields">
        <input id="llm-endpoint" data-i18n-placeholder="baseUrlPlaceholder">
        <input id="llm-model" data-i18n-placeholder="modelPlaceholder">
        <select id="llm-wire-api"><option value="responses">Responses API</option><option value="chat_completions">Chat Completions API</option></select>
        <input id="llm-key-env" data-i18n-placeholder="keyEnvPlaceholder">
        <div class="switch-row">
          <span data-i18n="enableLlm"></span>
          <label class="switch" data-i18n-title="enableLlmTitle"><input type="checkbox" id="llm-enabled"><span class="slider"></span></label>
        </div>
        <button id="llm-save" data-i18n="saveConfig"></button>
        <div id="llm-status" class="sub"></div>
      </div>
    </aside>
  </div>
</main>
<script src="/assets/learning-i18n.js"></script>
<script>
const I18N=window.ForgeI18n;const tr=(key,values)=>I18N.t(key,values);const $=id=>document.getElementById(id);const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));let projects=[],allOverlays=[];const initial=new URLSearchParams(location.search);
I18N.mountSelector(document.querySelector('.hero-tools'));I18N.apply(document);
function displayState(overlay){return overlay.status==='REVIEWED'&&overlay.published_at?'PUBLISHED':overlay.status}
function stateLabel(state){return tr(({DRAFT:'draft',REVIEWED:'reviewed',PUBLISHED:'published',ACTIVE:'active',DISABLED:'disabled'})[state]||state)}
function updateUrl(){let query=new URLSearchParams();if($('project').value)query.set('project',$('project').value);if($('skill').value)query.set('skill',$('skill').value);if($('status').value)query.set('status',$('status').value);history.replaceState(null,'',query.size?`/overlays?${query}`:'/overlays')}
function evaluationMeta(overlay){let behavior=overlay.evaluation?.behavior;if(behavior){if(behavior.error)return `<div class="evaluation error">${esc(tr('evaluationFailed',{error:behavior.error}))}</div>`;let gates=(behavior.gates||[]).map(gate=>`${tr(gate.passed?'gatePassed':'gateFailed')} ${gate.id}`).join(' · ');return `<div class="evaluation">${esc(tr('evaluationSummary',{count:behavior.caseCount,confidence:behavior.confidence,gates}))}</div>`}let readiness=overlay.evaluationReadiness;if(!readiness)return '';return readiness.ready?`<div class="evaluation">${esc(tr('evaluationReady',{count:readiness.caseCount,required:readiness.requiredCaseCount,categories:(readiness.categories||[]).join(', ')}))}</div>`:`<div class="evaluation error">${esc(tr('evaluationInsufficient',{count:readiness.caseCount,required:readiness.requiredCaseCount}))}${readiness.error?` · ${esc(readiness.error)}`:''}</div>`}
function overlayCard(overlay){let state=displayState(overlay),ready=overlay.evaluationReadiness?.ready===true;let evaluateTitle=ready?tr('evaluateTitle'):tr('evaluationInsufficient',{count:overlay.evaluationReadiness?.caseCount??0,required:overlay.evaluationReadiness?.requiredCaseCount??3});let actions=[];if(overlay.status==='DRAFT')actions.push(`<button data-action="review">${esc(tr('overlayReviewApprove'))}</button>`);if(overlay.status==='REVIEWED'&&!overlay.published_at)actions.push(`<button data-action="evaluate" title="${esc(evaluateTitle)}" ${ready?'':'disabled'}>${esc(tr(overlay.evaluation?'reevaluatePublish':'evaluatePublish'))}</button>`);if(overlay.status==='REVIEWED'&&overlay.published_at)actions.push(`<button data-action="activate">${esc(tr('activate'))}</button>`);if(overlay.status==='ACTIVE')actions.push(`<button data-action="disable">${esc(tr('disable'))}</button>`);if(overlay.status!=='ACTIVE')actions.push(`<button class="danger" data-action="delete">${esc(tr('overlayDelete'))}</button>`);let dates=[tr('overlayCreated',{time:overlay.created_at})];if(overlay.published_at)dates.push(tr('overlayPublishedAt',{time:overlay.published_at}));if(overlay.disabled_at)dates.push(tr('overlayDisabledAt',{time:overlay.disabled_at}));return `<article class="overlay" data-overlay-id="${esc(overlay.id)}" data-project="${esc(overlay.project_id)}" data-skill="${esc(overlay.skill)}" data-version="${overlay.version}" data-has-evaluation="${overlay.evaluation?'true':'false'}"><div class="overlay-head"><div><span class="overlay-title">${esc(overlay.skill)} · Overlay v${overlay.version}</span> <span class="tag ${esc(state)}">${esc(stateLabel(state))}</span></div><div class="actions"><span class="sub">${esc(tr('summarySources',{count:overlay.sourceSummaryIds.length}))}</span>${actions.join('')}</div></div><div class="meta"><span>${esc(dates.join(' · '))}</span><span>${esc(overlay.content_digest)}</span></div>${overlay.status==='DRAFT'?`<div class="draft-hint">${esc(tr('overlayDraftHint'))}</div>`:''}<label class="content-label" for="content-${esc(overlay.id)}">${esc(tr('overlayContent'))}</label><textarea id="content-${esc(overlay.id)}" data-overlay-content ${overlay.status==='DRAFT'?'':'disabled'}>${esc(overlay.content)}</textarea>${evaluationMeta(overlay)}</article>`}
function render(){let status=$('status').value,visible=allOverlays.filter(overlay=>!$('skill').value||overlay.skill===$('skill').value).filter(overlay=>!status||displayState(overlay)===status);let scoped=allOverlays.filter(overlay=>!$('skill').value||overlay.skill===$('skill').value);$('stats').innerHTML=[[tr('totalOverlays'),scoped.length],[tr('draftOverlays'),scoped.filter(v=>v.status==='DRAFT').length],[tr('publishedOverlays'),scoped.filter(v=>Boolean(v.published_at)).length],[tr('activeOverlays'),scoped.filter(v=>v.status==='ACTIVE').length]].map(([label,count])=>`<div class="stat"><span>${esc(label)}</span><b>${count}</b></div>`).join('');$('overlays').innerHTML=visible.length?visible.map(overlayCard).join(''):`<div class="panel empty">${esc(tr('noFilteredOverlays'))}</div>`;$('message').textContent=tr('overlayCount',{count:visible.length});$('message').className='message sub';updateUrl()}
function populateFilters(){let project=$('project').value||initial.get('project')||'',skill=$('skill').value||initial.get('skill')||'',status=$('status').value||initial.get('status')||'';$('project').innerHTML=`<option value="">${esc(tr('allProjects'))}</option>`+projects.map(item=>`<option value="${esc(item.projectId)}">${esc(item.name)} [${esc(item.status)}]</option>`).join('');$('project').value=projects.some(item=>item.projectId===project)?project:'';let skills=[...new Set(allOverlays.map(item=>item.skill))].sort();$('skill').innerHTML=`<option value="">${esc(tr('allSkills'))}</option>`+skills.map(item=>`<option value="${esc(item)}">${esc(item)}</option>`).join('');$('skill').value=skills.includes(skill)?skill:'';$('status').innerHTML=`<option value="">${esc(tr('allOverlayStates'))}</option>`+['DRAFT','REVIEWED','PUBLISHED','ACTIVE','DISABLED'].map(state=>`<option value="${state}">${esc(stateLabel(state))}</option>`).join('');$('status').value=['DRAFT','REVIEWED','PUBLISHED','ACTIVE','DISABLED'].includes(status)?status:''}
async function load(){try{let project=$('project').value||initial.get('project')||'';let [projectResponse,overlayResponse]=await Promise.all([fetch('/api/projects'),fetch('/api/overlays?'+new URLSearchParams({project}))]);let projectValues=await projectResponse.json(),overlayValues=await overlayResponse.json();if(!projectResponse.ok)throw new Error(projectValues.error||tr('loadingFailed'));if(!overlayResponse.ok)throw new Error(overlayValues.error||tr('overlayLoadFailed'));projects=projectValues;allOverlays=overlayValues;populateFilters();render()}catch(error){$('message').textContent=error.message;$('message').className='message error'}}
function identity(card){return {overlayId:card.dataset.overlayId,projectId:card.dataset.project,skill:card.dataset.skill}}
async function post(button,url,payload,successMessage){button.disabled=true;try{let response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),value=await response.json();if(!response.ok)throw new Error(value.error||tr('overlayOperationFailed'));await load();$('message').textContent=successMessage(value);$('message').className='message sub'}catch(error){$('message').textContent=error.message;$('message').className='message error'}finally{button.disabled=false}}
$('overlays').addEventListener('click',async event=>{let button=event.target.closest('button[data-action]');if(!button)return;let card=button.closest('[data-overlay-id]'),payload=identity(card),action=button.dataset.action;if(action==='review'){payload.content=card.querySelector('[data-overlay-content]').value;await post(button,'/api/review-overlay',payload,()=>tr('overlayReviewed'));return}if(action==='evaluate'){if(!confirm(tr('evaluationConfirm')))return;payload.forceEvaluation=card.dataset.hasEvaluation==='true';button.disabled=true;try{let response=await fetch('/api/evaluate-publish-overlay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),value=await response.json();await load();if(!response.ok){let gates=value.evaluation?.behavior?.gates?.filter(g=>!g.passed).map(g=>g.id).join(', ');throw new Error(value.error||gates&&tr('evaluationRejected',{gates})||value.evaluation?.behavior?.error||tr('evaluationDidNotPass'))}$('message').textContent=tr('evaluationPublished',{version:value.version});$('message').className='message sub'}catch(error){$('message').textContent=error.message;$('message').className='message error'}finally{button.disabled=false}return}if(action==='activate'){if(!confirm(tr('activateConfirm')))return;await post(button,'/api/activate-overlay',payload,()=>tr('overlayActivated'));return}if(action==='disable'){if(!confirm(tr('disableConfirm')))return;await post(button,'/api/disable-overlay',payload,()=>tr('overlayDisabled'));return}if(action==='delete'){if(!confirm(tr('deleteOverlayConfirm')))return;await post(button,'/api/delete-overlay',payload,()=>tr('overlayDeleted'))}});
async function loadLlm(){try{let response=await fetch('/api/llm-config'),config=await response.json();if(!response.ok)throw new Error(config.error||tr('loadingFailed'));$('llm-enabled').checked=Boolean(config.enabled);$('llm-endpoint').value=config.baseUrl||'';$('llm-model').value=config.model||'';$('llm-wire-api').value=config.wireApi||'responses';$('llm-key-env').value=config.apiKeyEnv||'FORGE_LEARNING_LLM_API_KEY';$('llm-status').textContent=(config.configured?tr('llmReady'):tr('llmUnavailable'))+(config.requestUrl?` · ${config.requestUrl}`:'')}catch(error){$('llm-status').textContent=error.message;$('llm-status').className='sub error'}}
async function saveLlm(){let button=$('llm-save');button.disabled=true;try{let response=await fetch('/api/llm-config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:$('llm-enabled').checked,baseUrl:$('llm-endpoint').value.trim(),model:$('llm-model').value.trim(),wireApi:$('llm-wire-api').value,apiKeyEnv:$('llm-key-env').value.trim()})}),value=await response.json();if(!response.ok)throw new Error(value.error||tr('llmConfigSaveFailed'));$('llm-endpoint').value=value.baseUrl||'';$('llm-status').textContent=(value.configured?tr('llmReady'):tr('llmSavedNeedsEnv'))+(value.requestUrl?` · ${value.requestUrl}`:'');$('llm-status').className='sub'}catch(error){$('llm-status').textContent=error.message;$('llm-status').className='sub error'}finally{button.disabled=false}}
$('project').onchange=()=>{$('skill').value='';initial.delete('project');initial.delete('skill');load()};$('skill').onchange=()=>{initial.delete('skill');render()};$('status').onchange=()=>{initial.delete('status');render()};$('refresh').onclick=load;$('llm-save').onclick=saveLlm;$('llm-enabled').onchange=saveLlm;load();loadLlm();
</script>
</body>
</html>
