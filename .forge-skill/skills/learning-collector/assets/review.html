<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forge Learning Review</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#182230;background:#f4f6f9}*{box-sizing:border-box}body{margin:0}.shell{max-width:1440px;margin:auto;padding:24px}.head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:20px}h1{font-size:26px;margin:0}h2{font-size:16px;margin:0 0 12px}.sub{color:#667085;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:10px}.stat,.panel{background:#fff;border:1px solid #e1e6ee;border-radius:8px}.stat{padding:14px}.num{font-size:27px;font-weight:700;margin-top:4px}.panel{padding:16px;margin-top:14px}.filters{display:grid;grid-template-columns:1fr 1fr 1fr 2fr auto;gap:8px}select,input,textarea,button{font:inherit;border:1px solid #cbd3df;border-radius:6px;padding:8px 10px;background:#fff}button{border:0;background:#175cd3;color:#fff;cursor:pointer}.secondary{background:#475467}.danger{background:#b42318}.records{margin-top:12px}.record{border-top:1px solid #e7ebf0;padding:14px 0}.record:first-child{border-top:0}.row{display:flex;justify-content:space-between;gap:12px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{background:#eef2f6;border-radius:999px;padding:3px 8px;font-size:12px}.tag.ACTIVE{background:#dcfae6;color:#067647}.tag.EXCLUDED{background:#fef0c7;color:#93370d}.tag.DELETED{background:#fee4e2;color:#b42318}.content{white-space:pre-wrap;background:#f8fafc;padding:10px;border-radius:6px;margin:9px 0;max-height:220px;overflow:auto;font-size:13px}.edit{display:grid;grid-template-columns:2fr 1fr auto auto auto;gap:7px;align-items:end}.edit textarea{min-height:62px;resize:vertical}.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:12px;color:#667085}.empty{text-align:center;color:#667085;padding:35px}.error{color:#b42318}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.filters,.edit{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}}
</style></head><body><main class="shell"><header class="head"><div><h1>Forge Learning Review</h1><div class="sub">项目隔离采集，统一审核。此页面不执行学习或校正。</div></div><button id="refresh">刷新数据</button></header><section id="stats" class="stats"></section><section class="panel"><h2>数据筛选</h2><div class="filters"><select id="project"><option value="">全部项目</option></select><select id="skill"><option value="">全部 Skill</option></select><select id="status"><option value="">全部状态</option><option>ACTIVE</option><option>EXCLUDED</option><option>DELETED</option></select><input id="q" placeholder="搜索输出、备注或运行 ID"><button id="search">搜索</button></div></section><section class="panel"><h2>采集记录</h2><div id="message" class="sub"></div><div id="records" class="records"></div></section></main>
<script>
const $=id=>document.getElementById(id);let records=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const text=v=>typeof v==='string'?v:JSON.stringify(v,null,2);
async function load(){try{let params=new URLSearchParams({project:$('project').value,skill:$('skill').value,status:$('status').value,q:$('q').value,limit:'500'});let [ps,rs]=await Promise.all([fetch('/api/projects').then(r=>r.json()),fetch('/api/records?'+params).then(r=>r.json())]);records=rs;let selected=$('project').value;$('project').innerHTML='<option value="">全部项目</option>'+ps.map(p=>`<option value="${esc(p.projectId)}">${esc(p.name)} [${esc(p.status)}]</option>`).join('');$('project').value=selected;let unhealthy=ps.filter(p=>p.status!=='ACTIVE');$('message').textContent=unhealthy.length?`${unhealthy.length} 个项目不可用或存在身份冲突，请检查项目位置。`:'';$('message').className=unhealthy.length?'error':'sub';let skill=$('skill').value,skills=[...new Set(rs.map(r=>r.skill))].sort();$('skill').innerHTML='<option value="">全部 Skill</option>'+skills.map(s=>`<option>${esc(s)}</option>`).join('');$('skill').value=skill;render()}catch(e){$('message').textContent=e.message;$('message').className='error'}}
function render(){let count=s=>records.filter(r=>r.review_status===s).length;$('stats').innerHTML=`<div class="stat"><div class="sub">当前结果</div><div class="num">${records.length}</div></div><div class="stat"><div class="sub">有效</div><div class="num">${count('ACTIVE')}</div></div><div class="stat"><div class="sub">已排除</div><div class="num">${count('EXCLUDED')}</div></div><div class="stat"><div class="sub">已删除</div><div class="num">${count('DELETED')}</div></div>`;$('records').innerHTML=records.length?records.map(card).join(''):'<div class="empty">没有符合条件的记录</div>';document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>review(b))}
function card(r){return `<article class="record"><div class="row"><div class="tags"><span class="tag">${esc(r.project_name)}</span><span class="tag">${esc(r.skill)}</span><span class="tag ${r.review_status}">${r.review_status}</span>${r.reviewed?'<span class="tag">已审核</span>':''}</div><div class="sub">${esc(r.captured_at)}</div></div><div class="content">${esc(text(r.output))}</div><div class="edit"><div class="field"><label>修订内容</label><textarea id="edit-${r.id}">${esc(r.edited_content??text(r.output))}</textarea></div><div class="field"><label>审核备注</label><textarea id="note-${r.id}">${esc(r.review_note)}</textarea></div><button data-action="ACTIVE" data-id="${r.id}" data-project="${r.project_id}">保留</button><button class="secondary" data-action="EXCLUDED" data-id="${r.id}" data-project="${r.project_id}">排除</button><button class="danger" data-action="DELETED" data-id="${r.id}" data-project="${r.project_id}">删除</button></div></article>`}
async function review(b){let payload={projectId:b.dataset.project,recordId:b.dataset.id,action:b.dataset.action,editedContent:$('edit-'+b.dataset.id).value,note:$('note-'+b.dataset.id).value};let response=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!response.ok){$('message').textContent=(await response.json()).error;return}await load()}
$('refresh').onclick=load;$('search').onclick=load;$('q').onkeydown=e=>{if(e.key==='Enter')load()};load();
</script></body></html>
