<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forge Learning Review</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#172033;background:#edf2f7;line-height:1.5;--navy:#102a43;--blue:#1769aa;--cyan:#2f9ed0;--muted:#6b7c93;--line:#dce5ee;--surface:#fff;--soft:#f6f9fc;--green:#087f5b;--amber:#b45309;--red:#b42318}*{box-sizing:border-box}body{margin:0;min-height:100vh}.shell{max-width:1480px;margin:0 auto;padding:28px 32px 44px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;background:var(--navy);color:#fff;border-radius:18px;padding:34px 38px;margin-bottom:24px;box-shadow:0 10px 28px rgba(16,42,67,.2)}h1{font-size:30px;line-height:1.15;margin:0;font-weight:750;letter-spacing:.2px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.6px;color:#a9d8ee;margin-bottom:9px}.sub{color:var(--muted);font-size:13px}.hero .sub{color:#c4d4e2;margin-top:10px}.hero button{background:#fff;color:var(--navy);font-weight:650;padding:10px 16px;border-radius:8px;white-space:nowrap}.context{display:flex;align-items:center;gap:10px;min-height:42px;margin:-8px 0 20px;padding:0 4px;color:var(--muted);font-size:13px}.context strong{color:#172033}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;box-shadow:0 3px 12px rgba(16,42,67,.05);border-top:3px solid var(--cyan)}.stat:nth-child(2){border-top-color:var(--green)}.stat:nth-child(3){border-top-color:var(--amber)}.stat:nth-child(4){border-top-color:var(--red)}.stat-label{font-size:12px;color:var(--muted)}.num{font-size:34px;font-weight:800;line-height:1.15;margin-top:6px;color:var(--navy)}.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 24px;box-shadow:0 3px 12px rgba(16,42,67,.045)}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.panel-title h2{margin:0;font-size:17px;color:var(--navy)}.panel-title h2:before{content:"";display:inline-block;width:4px;height:18px;background:var(--cyan);border-radius:2px;margin-right:9px;vertical-align:-3px}.filters{display:grid;grid-template-columns:1.15fr 1fr .8fr 2fr auto;gap:10px}select,input,textarea,button{font:inherit;border:1px solid #c8d4e1;border-radius:8px;padding:9px 11px;background:#fff;color:#172033}select:focus,input:focus,textarea:focus{outline:2px solid rgba(47,158,208,.25);border-color:var(--cyan)}button{border:0;background:var(--blue);color:#fff;cursor:pointer;font-weight:600;transition:filter .15s,transform .15s}button:hover{filter:brightness(1.08);transform:translateY(-1px)}button.secondary{background:#526579}.danger{background:var(--red)}.workspace{display:grid;grid-template-columns:minmax(320px,.82fr) minmax(0,1.8fr);gap:20px;margin-top:20px;align-items:start}.summary-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.summary-list{margin-top:16px}.summary-version{border-top:1px solid var(--line);padding:14px 0}.summary-version:first-child{border-top:0;padding-top:0}.summary-version b{color:var(--navy)}.summary-json,.content{white-space:pre-wrap;background:var(--soft);border:1px solid #e6edf4;border-radius:8px;padding:12px;font-size:12px;overflow:auto}.summary-json{max-height:220px;margin-top:9px}.records{margin-top:4px}.record{border-top:1px solid var(--line);padding:18px 0}.record:first-child{border-top:0;padding-top:0}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{display:inline-flex;align-items:center;background:#edf3f8;color:#40566d;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:650}.tag.ACTIVE{background:#e3f8ef;color:var(--green)}.tag.EXCLUDED{background:#fff2d8;color:var(--amber)}.tag.DELETED{background:#fee8e7;color:var(--red)}.content{margin:11px 0;max-height:230px;font-size:13px;color:#334e68}.edit{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(170px,.8fr) auto auto auto;gap:8px;align-items:end}.edit textarea{min-height:72px;resize:vertical;width:100%}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:38px 12px}.error{color:var(--red)}details summary{cursor:pointer;color:var(--blue);font-size:12px;margin-top:10px}.message{min-height:20px;margin-bottom:3px}.section-note{margin:-7px 0 17px}.count-pill{font-size:12px;color:var(--muted);background:var(--soft);border-radius:999px;padding:4px 9px}@media(max-width:1050px){.workspace{grid-template-columns:1fr}.edit{grid-template-columns:minmax(0,1.4fr) minmax(150px,.8fr) auto auto auto}}@media(max-width:760px){.shell{padding:16px 12px 28px}.hero{align-items:flex-start;flex-direction:column;padding:26px 24px}.hero button{width:100%}.stats{grid-template-columns:1fr 1fr;gap:10px}.panel{padding:18px 16px}.filters,.edit{grid-template-columns:1fr}.edit button{width:100%}.row{flex-direction:column;gap:6px}}
</style>
</head>
<body>
<main class="shell">
<header class="hero"><div><div class="eyebrow">Forge · local learning workspace</div><h1>学习数据审核</h1><div class="sub">按项目隔离采集结果，人工审核后生成可启用的 Skill 汇总版本。</div></div><button id="refresh">刷新数据</button></header>
<div class="context"><span>当前范围：</span><strong id="scope-label">全部项目 · 全部 Skill</strong><span id="message" class="message sub"></span></div>
<section id="stats" class="stats"></section>
<section class="panel"><div class="panel-title"><h2>筛选采集记录</h2><span class="count-pill">每页 20 条</span></div><div class="filters"><select id="project"><option value="">全部项目</option></select><select id="skill"><option value="">全部 Skill</option></select><select id="status"><option value="">全部状态</option><option>ACTIVE</option><option>EXCLUDED</option><option>DELETED</option></select><input id="q" placeholder="搜索输出、备注或运行 ID"><button id="search">应用筛选</button></div></section>
<div class="workspace">
<section class="panel"><div class="panel-title"><h2>Skill 学习汇总</h2></div><p class="sub section-note">仅使用当前项目与 Skill 下的有效审核数据生成新版本。生成后仍需人工启用。</p><div class="summary-actions"><button id="summarize">生成新版本</button><span id="summary-message" class="sub"></span></div><div id="summaries" class="summary-list"></div></section>
<section class="panel"><div class="panel-title"><h2>采集记录</h2><span id="record-count" class="count-pill"></span></div><div id="records" class="records"></div></section>
</div>
</main>
<style>.pagination{display:flex;align-items:center;justify-content:center;gap:10px;border-top:1px solid var(--line);padding-top:16px;margin-top:8px}.pagination button{padding:7px 12px}.pagination button:disabled{opacity:.45;cursor:not-allowed;transform:none}.page-label{font-size:12px;color:var(--muted);min-width:90px;text-align:center}.workspace>.panel:first-child{position:sticky;top:20px}.workspace>.panel:first-child .summary-list{max-height:calc(100vh - 260px);overflow:auto;padding-right:4px}@media(max-width:1050px){.workspace>.panel:first-child{position:static}.workspace>.panel:first-child .summary-list{max-height:none;overflow:visible;padding-right:0}}</style>
<style>.version-link{color:#fff;text-decoration:none;border:1px solid #6f94af;border-radius:8px;padding:8px 11px;font-size:12px;white-space:nowrap}.hero-actions{display:flex;align-items:center;gap:8px}@media(max-width:760px){.hero-actions{width:100%;flex-direction:column;align-items:stretch}.version-link{text-align:center}}</style>
<style>.summary-actions #summarize{position:sticky;top:16px;z-index:4;padding:7px 10px;font-size:12px;box-shadow:0 3px 10px rgba(16,42,67,.14)}</style>
<style>.summary-scope{font-size:12px;color:var(--muted);font-weight:500;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}</style>
<script>
const PAGE_SIZE=20;let currentPage=1;document.querySelector('.hero').insertAdjacentHTML('beforeend','<div class="hero-actions"><a class="version-link" href="/versions">版本管理</a><button id="refresh">刷新数据</button></div>');document.querySelector('.hero>button#refresh')?.remove();document.querySelector('.workspace>.panel:first-child .panel-title').insertAdjacentHTML('beforeend','<span id="summary-scope" class="summary-scope">未选择范围</span>');
const $=id=>document.getElementById(id);let records=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const text=v=>typeof v==='string'?v:JSON.stringify(v,null,2);
function updateScope(){const p=$('project').selectedOptions[0]?.textContent||'全部项目';const s=$('skill').value||'全部 Skill';$('scope-label').textContent=`${p} · ${s}`;$('record-count').textContent=`${records.length} 条`}
async function load(){try{let params=new URLSearchParams({project:$('project').value,skill:$('skill').value,status:$('status').value,q:$('q').value,limit:'500'});let [ps,rs]=await Promise.all([fetch('/api/projects').then(r=>r.json()),fetch('/api/records?'+params).then(r=>r.json())]);records=rs;let selected=$('project').value;$('project').innerHTML='<option value="">全部项目</option>'+ps.map(p=>`<option value="${esc(p.projectId)}">${esc(p.name)} [${esc(p.status)}]</option>`).join('');$('project').value=selected;let unhealthy=ps.filter(p=>p.status!=='ACTIVE');$('message').textContent=unhealthy.length?`${unhealthy.length} 个项目不可用或存在身份冲突，请检查项目位置。`:'';$('message').className=unhealthy.length?'message error':'message sub';let skill=$('skill').value,skills=[...new Set(rs.map(r=>r.skill))].sort();$('skill').innerHTML='<option value="">全部 Skill</option>'+skills.map(s=>`<option>${esc(s)}</option>`).join('');$('skill').value=skill;updateScope();render();await loadSummaries()}catch(e){$('message').textContent=e.message;$('message').className='message error'}}
async function loadSummaries(){let p=$('project').value,s=$('skill').value;if(!p||!s){$('summaries').innerHTML='<div class="empty">请选择项目和 Skill</div>';return}let response=await fetch('/api/summaries?'+new URLSearchParams({project:p,skill:s,limit:'10',details:'1'}));let values=await response.json();if(!response.ok)throw new Error(values.error||'无法加载汇总版本');$('summaries').innerHTML=values.length?values.map(v=>{let action=v.applied?'':'<button data-apply-version="'+v.version+'">启用</button>';return `<div class="summary-version"><b>v${v.version}</b> · ${v.applied?'<span class="tag ACTIVE">当前应用</span>':'<span class="tag">未启用</span>'} · ${v.source_count} 条有效记录 · ${esc(v.created_at)} ${action}<details><summary>查看汇总快照</summary><div class="summary-json">${esc(text(v.summary))}</div></details></div>`}).join(''):'<div class="empty">尚未生成汇总版本</div>';document.querySelectorAll('[data-apply-version]').forEach(b=>b.onclick=()=>applySummary(Number(b.dataset.applyVersion)))}
async function applySummary(version){let response=await fetch('/api/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({projectId:$('project').value,skill:$('skill').value,version})});let value=await response.json();$('summary-message').textContent=response.ok?`已启用 v${version}`:(value.error||'启用失败');if(response.ok)await loadSummaries()}
function render(){let count=s=>records.filter(r=>r.review_status===s).length;$('stats').innerHTML=`<div class="stat"><div class="stat-label">当前结果</div><div class="num">${records.length}</div></div><div class="stat"><div class="stat-label">有效记录</div><div class="num">${count('ACTIVE')}</div></div><div class="stat"><div class="stat-label">已排除</div><div class="num">${count('EXCLUDED')}</div></div><div class="stat"><div class="stat-label">已删除</div><div class="num">${count('DELETED')}</div></div>`;$('records').innerHTML=records.length?records.map(card).join(''):'<div class="empty">没有符合条件的记录</div>';document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>review(b));updateScope()}
function card(r){return `<article class="record"><div class="row"><div class="tags"><span class="tag">${esc(r.project_name)}</span><span class="tag">${esc(r.skill)}</span><span class="tag ${r.review_status}">${r.review_status}</span>${r.reviewed?'<span class="tag">已审核</span>':''}</div><div class="sub">${esc(r.captured_at)}</div></div><div class="content">${esc(text(r.output))}</div><div class="edit"><div class="field"><label>修订内容</label><textarea id="edit-${r.id}">${esc(r.edited_content??text(r.output))}</textarea></div><div class="field"><label>审核备注</label><textarea id="note-${r.id}">${esc(r.review_note)}</textarea></div><label><input type="checkbox" id="classic-${r.id}" ${r.is_classic?'checked':''}> 标记为经典案例</label><input type="text" id="classic-reason-${r.id}" placeholder="经典案例理由" value="${esc(r.classic_reason||'')}"><button data-action="ACTIVE" data-id="${r.id}" data-project="${r.project_id}">保留</button><button class="secondary" data-action="EXCLUDED" data-id="${r.id}" data-project="${r.project_id}">排除</button><button class="danger" data-action="DELETED" data-id="${r.id}" data-project="${r.project_id}">删除</button></div></article>`}
async function review(b){let payload={projectId:b.dataset.project,recordId:b.dataset.id,action:b.dataset.action,editedContent:$('edit-'+b.dataset.id).value,note:$('note-'+b.dataset.id).value,isClassic:$('classic-'+b.dataset.id).checked,classicReason:$('classic-reason-'+b.dataset.id).value};let response=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!response.ok){$('message').textContent=(await response.json()).error;return}await load()}
$('refresh').onclick=load;$('search').onclick=load;$('q').onkeydown=e=>{if(e.key==='Enter')load()};$('project').onchange=load;$('skill').onchange=load;$('status').onchange=load;$('summarize').onclick=async()=>{let project=$('project').value,skill=$('skill').value;if(!project||!skill){$('summary-message').textContent='请先选择项目和 Skill';return}let response=await fetch('/api/summarize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({projectId:project,skill})});let value=await response.json();if(!response.ok){$('summary-message').textContent=value.error||'汇总失败';return}$('summary-message').textContent=`已生成 v${value.version}，等待人工启用`;await loadSummaries()};load();
function render(){let count=s=>records.filter(r=>r.review_status===s).length;let pages=Math.max(1,Math.ceil(records.length/PAGE_SIZE));currentPage=Math.min(currentPage,pages);let start=(currentPage-1)*PAGE_SIZE;let visible=records.slice(start,start+PAGE_SIZE);$('stats').innerHTML=`<div class="stat"><div class="stat-label">当前结果</div><div class="num">${records.length}</div></div><div class="stat"><div class="stat-label">有效记录</div><div class="num">${count('ACTIVE')}</div></div><div class="stat"><div class="stat-label">已排除</div><div class="num">${count('EXCLUDED')}</div></div><div class="stat"><div class="stat-label">已删除</div><div class="num">${count('DELETED')}</div></div>`;$('records').innerHTML=visible.length?visible.map(card).join(''):'<div class="empty">没有符合条件的记录</div>'; $('records').insertAdjacentHTML('beforeend',`<div class="pagination"><button id="prev-page" ${currentPage===1?'disabled':''}>上一页</button><span class="page-label">第 ${currentPage} / ${pages} 页</span><button id="next-page" ${currentPage===pages?'disabled':''}>下一页</button></div>`);$('prev-page').onclick=()=>{if(currentPage>1){currentPage--;render()}};$('next-page').onclick=()=>{if(currentPage<pages){currentPage++;render()}};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>review(b));updateScope()}
async function loadSummaries(){let p=$('project').value,s=$('skill').value;let projectName=$('project').selectedOptions[0]?.textContent||'全部项目';$('summary-scope').textContent=p&&s?`${projectName} · ${s}`:'请选择项目和 Skill';if(!p||!s){$('summaries').innerHTML='<div class="empty">请选择项目和 Skill</div>';return}let response=await fetch('/api/summaries?'+new URLSearchParams({project:p,skill:s,limit:'200',details:'1'}));let values=await response.json();if(!response.ok)throw new Error(values.error||'无法加载汇总版本');let applied=values.find(v=>v.applied);$('summaries').innerHTML=applied?`<div class="summary-version"><b>v${applied.version}</b> · <span class="tag ACTIVE">当前应用</span> · ${applied.source_count} 条有效记录 · ${esc(applied.created_at)}<details><summary>查看汇总快照</summary><div class="summary-json">${esc(text(applied.summary))}</div></details></div>`:'<div class="empty">当前 Skill 尚未启用汇总版本</div>'}
</script>
</body>
</html>
