<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forge Learning Review</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#172033;background:#edf2f7;line-height:1.5;--navy:#102a43;--blue:#1769aa;--cyan:#2f9ed0;--muted:#6b7c93;--line:#dce5ee;--surface:#fff;--soft:#f6f9fc;--green:#087f5b;--amber:#b45309;--red:#b42318}*{box-sizing:border-box}body{margin:0;min-height:100vh}.shell{max-width:1480px;margin:0 auto;padding:28px 32px 44px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;background:var(--navy);color:#fff;border-radius:18px;padding:34px 38px;margin-bottom:24px;box-shadow:0 10px 28px rgba(16,42,67,.2)}h1{font-size:30px;line-height:1.15;margin:0;font-weight:750;letter-spacing:.2px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.6px;color:#a9d8ee;margin-bottom:9px}.sub{color:var(--muted);font-size:13px}.hero .sub{color:#c4d4e2;margin-top:10px}.hero button{background:#fff;color:var(--navy);font-weight:650;padding:10px 16px;border-radius:8px;white-space:nowrap}.context{display:flex;align-items:center;gap:10px;min-height:42px;margin:-8px 0 20px;padding:0 4px;color:var(--muted);font-size:13px}.context strong{color:#172033}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:22px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;box-shadow:0 3px 12px rgba(16,42,67,.05);border-top:3px solid var(--cyan)}.stat:nth-child(2){border-top-color:var(--green)}.stat:nth-child(3){border-top-color:var(--amber)}.stat-label{font-size:12px;color:var(--muted)}.num{font-size:34px;font-weight:800;line-height:1.15;margin-top:6px;color:var(--navy)}.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 24px;box-shadow:0 3px 12px rgba(16,42,67,.045)}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.panel-title h2{margin:0;font-size:17px;color:var(--navy)}.panel-title h2:before{content:"";display:inline-block;width:4px;height:18px;background:var(--cyan);border-radius:2px;margin-right:9px;vertical-align:-3px}.filters{display:grid;grid-template-columns:1.15fr 1fr .8fr 2fr auto auto;gap:10px}select,input,textarea,button{font:inherit;border:1px solid #c8d4e1;border-radius:8px;padding:9px 11px;background:#fff;color:#172033}select:focus,input:focus,textarea:focus{outline:2px solid rgba(47,158,208,.25);border-color:var(--cyan)}button{border:0;background:var(--blue);color:#fff;cursor:pointer;font-weight:600;transition:filter .15s,transform .15s}button:hover{filter:brightness(1.08);transform:translateY(-1px)}button.secondary{background:#526579}button:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none}.danger{background:var(--red)}.workspace{display:grid;grid-template-columns:minmax(320px,.82fr) minmax(0,1.8fr);gap:20px;margin-top:20px;align-items:start}.summary-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.summary-list{margin-top:16px}.summary-version{border-top:1px solid var(--line);padding:14px 0}.summary-version:first-child{border-top:0;padding-top:0}.summary-version b{color:var(--navy)}.summary-json,.content{white-space:pre-wrap;background:var(--soft);border:1px solid #e6edf4;border-radius:8px;padding:12px;font-size:12px;overflow:auto}.summary-json{max-height:220px;margin-top:9px}.records{margin-top:4px}.record{border-top:1px solid var(--line);padding:18px 0}.record:first-child{border-top:0;padding-top:0}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{display:inline-flex;align-items:center;background:#edf3f8;color:#40566d;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:650}.tag.ACTIVE{background:#e3f8ef;color:var(--green)}.tag.EXCLUDED{background:#fff2d8;color:var(--amber)}.tag.DELETED{background:#fee8e7;color:var(--red)}.content{margin:11px 0;max-height:230px;font-size:13px;color:#334e68}.edit{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(170px,.8fr) auto auto auto;gap:8px;align-items:end}.edit textarea{min-height:72px;resize:vertical;width:100%}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:38px 12px}.error{color:var(--red)}details summary{cursor:pointer;color:var(--blue);font-size:12px;margin-top:10px}.message{min-height:20px;margin-bottom:3px}.section-note{margin:-7px 0 17px}.count-pill{font-size:12px;color:var(--muted);background:var(--soft);border-radius:999px;padding:4px 9px}@media(max-width:1180px){.filters{grid-template-columns:1fr 1fr 1fr}.filters #q{grid-column:span 2}}@media(max-width:1050px){.workspace{grid-template-columns:1fr}.edit{grid-template-columns:minmax(0,1.4fr) minmax(150px,.8fr) auto auto auto}}@media(max-width:760px){.shell{padding:16px 12px 28px}.hero{align-items:flex-start;flex-direction:column;padding:26px 24px}.hero button{width:100%}.stats{grid-template-columns:1fr 1fr;gap:10px}.stats .stat:first-child{grid-column:1/-1}.panel{padding:18px 16px}.filters,.edit{grid-template-columns:1fr}.filters #q{grid-column:auto}.edit button{width:100%}.row{flex-direction:column;gap:6px}}
</style>
</head>
<body>
<main class="shell">
<header class="hero"><div class="hero-copy"><div class="eyebrow" data-i18n="reviewHomeEyebrow">Forge · 本地学习工作区</div><h1 data-i18n="reviewHomeTitle">学习数据审核</h1><div class="sub" data-i18n="reviewHomeSubtitle">按项目隔离采集结果，人工审核后生成可启用的 Skill 汇总版本。</div></div><div class="hero-tools"></div></header>
<div class="context"><span data-i18n="currentScope">当前范围：</span><strong id="scope-label">全部项目 · 全部 Skill</strong><span id="message" class="message sub"></span></div>
<section id="stats" class="stats"></section>
<section class="panel"><div class="panel-title"><h2 data-i18n="filterRecords">筛选采集记录</h2><span class="count-pill" data-i18n="perPage">每页 20 条</span></div><div class="filters"><select id="project"><option value="" data-i18n="allProjects">全部项目</option></select><select id="skill"><option value="" data-i18n="allSkills">全部 Skill</option></select><select id="status"><option value="" data-i18n="allStatuses">全部状态</option><option value="ACTIVE" data-i18n="active">有效</option><option value="EXCLUDED" data-i18n="excluded">已排除</option><option value="DELETED" data-i18n="deleted">已删除</option></select><input id="q" data-i18n-placeholder="searchPlaceholder" placeholder="搜索输出、备注或运行 ID"><button id="search" data-i18n="applyFilters">应用筛选</button><button id="project-status" class="secondary" disabled>归档项目</button></div></section>
<div class="workspace">
<section class="panel"><div class="panel-title"><h2 data-i18n="summaries">Skill 学习汇总</h2></div><p class="sub section-note" data-i18n="summaryNote">仅使用当前项目与 Skill 下的有效审核数据生成新版本。生成后仍需人工启用。</p><div class="summary-actions"><button id="summarize" data-i18n="generateVersion">生成新版本</button><span id="summary-message" class="sub"></span></div><div id="summaries" class="summary-list"></div></section>
<section class="panel"><div class="panel-title"><h2 data-i18n="records">采集记录</h2><span id="record-count" class="count-pill"></span></div><div id="records" class="records"></div></section>
</div>
</main>
<style>.pagination{display:flex;align-items:center;justify-content:center;gap:10px;border-top:1px solid var(--line);padding-top:16px;margin-top:8px}.pagination button{padding:7px 12px}.pagination button:disabled{opacity:.45;cursor:not-allowed;transform:none}.page-label{font-size:12px;color:var(--muted);min-width:90px;text-align:center}.workspace>.panel:first-child{position:sticky;top:20px}.workspace>.panel:first-child .summary-list{max-height:calc(100vh - 260px);overflow:auto;padding-right:4px}@media(max-width:1050px){.workspace>.panel:first-child{position:static}.workspace>.panel:first-child .summary-list{max-height:none;overflow:visible;padding-right:0}}</style>
<style>.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:28px;border-radius:10px;padding:22px 26px;margin-bottom:18px;box-shadow:0 8px 22px rgba(16,42,67,.16)}.hero-copy{max-width:760px}.hero h1{font-size:25px}.hero .eyebrow{margin-bottom:5px}.hero .sub{margin-top:6px;max-width:680px}.hero-tools{display:flex;align-items:center;justify-content:flex-end;gap:9px}.version-link{display:inline-flex;align-items:center;justify-content:center;height:36px;color:#fff;text-decoration:none;border:1px solid #557189;border-radius:6px;padding:0 12px;font-size:12px;font-weight:600;white-space:nowrap}.version-link:hover{background:rgba(255,255,255,.07)}.hero-actions{display:flex;align-items:center;gap:8px}.hero .hero-actions button{height:36px;padding:0 13px;border-radius:6px;font-size:12px}@media(max-width:760px){.hero{grid-template-columns:1fr;gap:17px;padding:20px;margin-bottom:16px}.hero h1{font-size:24px}.hero-tools{display:grid;grid-template-columns:1fr 1fr;width:100%;gap:8px}.hero-actions{display:contents}.version-link,.hero .hero-actions button{width:100%}}</style>
<style>.summary-actions #summarize{position:sticky;top:16px;z-index:4;padding:7px 10px;font-size:12px;box-shadow:0 3px 10px rgba(16,42,67,.14)}</style>
<style>.summary-scope{font-size:12px;color:var(--muted);font-weight:500;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}</style>
<script src="/assets/learning-i18n.js"></script><script>
const I18N=window.ForgeI18n;I18N.apply();I18N.mountSelector(document.querySelector('.hero-tools'));
const PAGE_SIZE=20;let currentPage=1;document.querySelector('.hero-tools').insertAdjacentHTML('beforeend','<div class="hero-actions"><a class="version-link" href="/versions">汇总管理</a><a class="version-link" href="/overlays">Overlay 管理</a><button id="refresh">刷新数据</button></div>');document.querySelector('.workspace>.panel:first-child .panel-title').insertAdjacentHTML('beforeend','<span id="summary-scope" class="summary-scope">未选择范围</span>');
const $=id=>document.getElementById(id);let records=[],projectItems=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const text=v=>typeof v==='string'?v:JSON.stringify(v,null,2);const tr=(key,values)=>I18N.t(key,values);
function updateScope(){const p=($('project').value&&$('project').selectedOptions[0]?.textContent)||tr('allProjects');const s=$('skill').value||tr('allSkills');$('scope-label').textContent=`${p} · ${s}`;$('record-count').textContent=tr('recordCount',{count:records.length})}
function selectedProject(){return projectItems.find(p=>p.projectId===$('project').value)}
function syncProjectAction(){let project=selectedProject(),button=$('project-status');button.disabled=!project||project.status==='CONFLICT';button.textContent=project?.status==='DISABLED'?tr('restoreProject'):project?.status==='CONFLICT'?tr('conflict'):tr('archiveProject')}
async function load(){try{let params=new URLSearchParams({project:$('project').value,skill:$('skill').value,status:$('status').value,q:$('q').value,page:String(currentPage)}),response=await fetch('/api/records-page?'+params),rs=await response.json();if(!response.ok)throw new Error(rs.error||'无法加载采集记录');let ps=rs.projects||[];projectItems=ps;records=rs.items||[];let selected=$('project').value;$('project').innerHTML=`<option value="">${esc(tr('allProjects'))}</option>`+ps.map(p=>`<option value="${esc(p.projectId)}">${esc(p.name)} [${esc(p.status)}]</option>`).join('');$('project').value=selected;let unhealthy=ps.filter(p=>p.status==='UNAVAILABLE'||p.status==='CONFLICT'),archived=ps.filter(p=>p.status==='DISABLED').length;$('message').textContent=unhealthy.length?`${unhealthy.length} 个项目不可用或存在身份冲突${archived?`，另有 ${archived} 个已归档项目`:''}。`:archived?`${archived} 个项目已归档，不参与全部项目扫描。`:'';$('message').className=unhealthy.length?'message error':'message sub';let skill=$('skill').value,skills=[...new Set(ps.flatMap(p=>Object.keys(p.databases||{})))].sort();$('skill').innerHTML=`<option value="">${esc(tr('allSkills'))}</option>`+skills.map(s=>`<option>${esc(s)}</option>`).join('');$('skill').value=skill;syncProjectAction();updateScope();render(rs.total||0,rs.hasMore);await loadSummaries()}catch(e){$('message').textContent=e.message;$('message').className='message error'}}
function card(r){return `<article class="record"><div class="row"><div class="tags"><span class="tag">${esc(r.project_name)}</span><span class="tag">${esc(r.skill)}</span><span class="tag ${r.review_status}">${esc(tr(r.review_status.toLowerCase()))}</span>${r.reviewed?`<span class="tag">${esc(tr('reviewedTag'))}</span>`:''}</div><div class="sub">${esc(r.captured_at)}</div></div><div class="content">${esc(text(r.output))}</div><div class="edit"><div class="field"><label>${esc(tr('editedContent'))}</label><textarea id="edit-${r.id}">${esc(r.edited_content??text(r.output))}</textarea></div><div class="field"><label>${esc(tr('reviewNote'))}</label><textarea id="note-${r.id}">${esc(r.review_note)}</textarea></div><label><input type="checkbox" id="classic-${r.id}" ${r.is_classic?'checked':''}> ${esc(tr('classicCase'))}</label><input type="text" id="classic-reason-${r.id}" placeholder="${esc(tr('classicReason'))}" value="${esc(r.classic_reason||'')}"><button data-action="ACTIVE" data-id="${r.id}" data-project="${r.project_id}">${esc(tr('keep'))}</button><button class="secondary" data-action="EXCLUDED" data-id="${r.id}" data-project="${r.project_id}">${esc(tr('exclude'))}</button><button class="danger" data-action="DELETED" data-id="${r.id}" data-project="${r.project_id}">${esc(tr('delete'))}</button></div></article>`}
async function review(b){let payload={projectId:b.dataset.project,recordId:b.dataset.id,action:b.dataset.action,editedContent:$('edit-'+b.dataset.id).value,note:$('note-'+b.dataset.id).value,isClassic:$('classic-'+b.dataset.id).checked,classicReason:$('classic-reason-'+b.dataset.id).value};let response=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),value=await response.json();if(!response.ok){$('message').textContent=value.error;return}await load();if(value.disabledOverlay){let event=value.disabledOverlay;$('message').textContent=`Overlay v${event.version} 已自动停用：${event.reviewedCount} 条已审核记录中 ${event.negativeCount} 条被排除（${Math.round(event.negativeRate*100)}%）`;$('message').className='message error'}}
$('refresh').onclick=()=>{currentPage=1;load()};$('search').onclick=()=>{currentPage=1;load()};$('q').onkeydown=e=>{if(e.key==='Enter'){currentPage=1;load()}};$('project').onchange=()=>{currentPage=1;syncProjectAction();load()};$('skill').onchange=()=>{currentPage=1;load()};$('status').onchange=()=>{currentPage=1;load()};$('project-status').onclick=async()=>{let project=selectedProject();if(!project)return;let action=project.status==='DISABLED'?'RESTORE':'ARCHIVE';if(action==='ARCHIVE'&&!confirm(`归档项目“${project.name}”？数据不会删除，但默认的全部项目视图将不再扫描它。`))return;let button=$('project-status');button.disabled=true;try{let response=await fetch('/api/project-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({projectId:project.projectId,action})}),value=await response.json();if(!response.ok)throw new Error(value.error||'更新项目状态失败');await load();$('message').textContent=action==='ARCHIVE'?'项目已归档，数据仍保留。':value.status==='ACTIVE'?'项目已恢复。':`项目仍不可用：${value.healthReason||'请检查项目路径与数据库'}`;$('message').className=value.status==='UNAVAILABLE'?'message error':'message sub'}catch(e){$('message').textContent=e.message;$('message').className='message error';syncProjectAction()}};$('summarize').onclick=async()=>{let project=$('project').value,skill=$('skill').value;if(!project||!skill){$('summary-message').textContent='请先选择项目和 Skill';return}let response=await fetch('/api/summarize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({projectId:project,skill})});let value=await response.json();if(!response.ok){$('summary-message').textContent=value.error||'汇总失败';return}$('summary-message').textContent=`已生成 v${value.version}，可作为项目 Overlay 的来源`;await loadSummaries()};load();
function render(total=records.length,hasMore=false){let count=s=>records.filter(r=>r.review_status===s).length;let pages=Math.max(1,Math.ceil(total/PAGE_SIZE));$('stats').innerHTML=`<div class="stat"><div class="stat-label">${tr('currentResults')}</div><div class="num">${total}</div></div><div class="stat"><div class="stat-label">${tr('pageActive')}</div><div class="num">${count('ACTIVE')}</div></div><div class="stat"><div class="stat-label">${tr('pageExcluded')}</div><div class="num">${count('EXCLUDED')}</div></div>`;$('records').innerHTML=records.length?records.map(card).join(''):`<div class="empty">${tr('noRecords')}</div>`; $('records').insertAdjacentHTML('beforeend',`<div class="pagination"><button id="prev-page" ${currentPage===1?'disabled':''}>${tr('previous')}</button><span class="page-label">${tr('page',{current:currentPage,total:pages})}</span><button id="next-page" ${!hasMore?'disabled':''}>${tr('next')}</button></div>`);$('prev-page').onclick=()=>{if(currentPage>1){currentPage--;load()}};$('next-page').onclick=()=>{if(hasMore){currentPage++;load()}};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>review(b));updateScope()}
async function loadSummaries(){let p=$('project').value,s=$('skill').value;let projectName=$('project').selectedOptions[0]?.textContent||tr('allProjects');$('summary-scope').textContent=p&&s?`${projectName} · ${s}`:tr('chooseScope');if(!p||!s){$('summaries').innerHTML=`<div class="empty">${esc(tr('chooseScope'))}</div>`;return}let response=await fetch('/api/summaries?'+new URLSearchParams({project:p,skill:s,limit:'200',details:'1'}));let values=await response.json();if(!response.ok)throw new Error(values.error||'无法加载汇总版本');let latest=values.find(v=>v.lifecycle_status==='REVIEWED')||values.find(v=>v.lifecycle_status==='DRAFT');$('summaries').innerHTML=latest?`<div class="summary-version"><b>v${latest.version}</b> · <span class="tag ${latest.lifecycle_status}">${latest.lifecycle_status}</span> · ${latest.source_count} 条有效记录 · ${esc(latest.created_at)}<div class="sub">汇总仅作为项目 Overlay 的生成来源，不直接参与 Skill 运行。</div><details><summary>查看汇总快照</summary><div class="summary-json">${esc(text(latest.summary))}</div></details></div>`:'<div class="empty">当前 Skill 尚无汇总版本</div>'}
</script>
<script>
(() => {
  const i18n = window.ForgeI18n;
  const map = {'学习数据审核':'Learning Data Review','按项目隔离采集结果，人工审核后生成可启用的 Skill 汇总版本。':'Review project-isolated results and turn approved evidence into versioned Skill summaries.','刷新数据':'Refresh data','汇总管理':'Summary Management','Overlay 管理':'Overlay Management','当前范围：':'Current scope:','筛选采集记录':'Filter collected records','每页 20 条':'20 per page','全部项目':'All projects','全部 Skill':'All Skills','全部状态':'All statuses','搜索输出、备注或运行 ID':'Search output, notes, or run ID','应用筛选':'Apply filters','归档项目':'Archive project','Skill 学习汇总':'Skill training summaries','采集记录':'Collected records','生成新版本':'Generate version','修订内容':'Edited content','审核备注':'Review note','标记为经典案例':'Mark as classic case','经典案例理由':'Why this is a classic case','保留':'Keep','排除':'Exclude','删除':'Delete','当前结果':'Current results','本页有效':'Active on page','本页排除':'Excluded on page','本页删除':'Deleted on page','上一页':'Previous','下一页':'Next','没有符合条件的记录':'No records match the filters','已审核':'Reviewed','查看汇总快照':'View summary snapshot','当前 Skill 尚无汇总版本':'This Skill has no summary versions'};
  function translate(root=document){if(i18n.language==='zh-CN')return;document.title='Forge Learning Review';const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];while(w.nextNode())nodes.push(w.currentNode);nodes.forEach(n=>{const t=n.nodeValue.trim();if(map[t])n.nodeValue=n.nodeValue.replace(t,map[t]);else if(/^第 (\d+) \/ (\d+) 页$/.test(t))n.nodeValue=n.nodeValue.replace(t,t.replace(/^第 (\d+) \/ (\d+) 页$/,'Page $1 of $2'));else if(/^(\d+) 条$/.test(t))n.nodeValue=n.nodeValue.replace(t,t.replace(/^(\d+) 条$/,'$1 records'));else if(/^(\d+) 条有效记录/.test(t))n.nodeValue=n.nodeValue.replace('条有效记录','active records')});root.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(el=>{if(el.placeholder==='搜索输出、备注或运行 ID')el.placeholder='Search output, notes, or run ID';if(el.placeholder==='经典案例理由')el.placeholder='Why this is a classic case'});root.querySelectorAll('select option').forEach(o=>{if(map[o.textContent])o.textContent=map[o.textContent]})}
  const observer=new MutationObserver(()=>translate());observer.observe(document.body,{childList:true,subtree:true});window.addEventListener('forge-language-change',()=>{translate();if(typeof load==='function')load()});setTimeout(translate,0);
})();
</script>
</body>
</html>
