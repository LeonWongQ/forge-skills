<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skill 汇总管理</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#172033;background:#edf2f7;--navy:#102a43;--blue:#1769aa;--muted:#6b7c93;--line:#dce5ee;--soft:#f6f9fc;--green:#087f5b;--amber:#b45309;--red:#b42318}*{box-sizing:border-box}body{margin:0}.shell{max-width:1320px;margin:auto;padding:28px 32px 48px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;background:var(--navy);color:#fff;border-radius:16px;padding:30px 34px;margin-bottom:20px;box-shadow:0 10px 28px rgba(16,42,67,.2)}h1{font-size:28px;margin:0}.eyebrow{font-size:12px;letter-spacing:1.5px;color:#a9d8ee;margin-bottom:7px}.sub{font-size:13px;color:var(--muted)}.hero .sub{color:#c4d4e2;margin-top:7px}.link{color:#fff;text-decoration:none;border:1px solid #6f94af;border-radius:8px;padding:8px 12px;font-size:13px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:start}.panel,.version{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 3px 12px rgba(16,42,67,.05)}.panel{padding:18px 20px}.config-panel{position:sticky;top:18px}.config-panel h2{font-size:16px;margin:0 0 5px;color:var(--navy)}.config-fields{display:grid;gap:10px;margin-top:16px}.config-fields input{width:100%}.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}.switch{position:relative;width:42px;height:24px;flex:0 0 auto}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#c8d4e1;border-radius:999px;cursor:pointer;transition:.2s}.slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}.switch input:checked+.slider{background:var(--green)}.switch input:checked+.slider:before{transform:translateX(18px)}.filters{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}select,input,textarea,button{font:inherit;border:1px solid #c8d4e1;border-radius:7px;padding:8px 10px;background:#fff;color:#172033}textarea{width:100%;min-height:76px;resize:vertical}button{border:0;background:var(--blue);color:#fff;font-weight:600;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.48}.danger{background:var(--red)}.versions{display:grid;gap:14px;margin-top:16px}.version{padding:18px 20px}.version-head,.actions,.tags{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.version-head{justify-content:space-between}.version-title{font-size:16px;font-weight:750;color:var(--navy)}.summary-select{display:inline-flex;align-items:center;gap:5px;margin-right:5px;color:var(--blue);font-size:12px;font-weight:650}.summary-select input{margin:0}.tag{display:inline-flex;background:#edf3f8;color:#40566d;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:650}.tag.active,.tag.REVIEWED,.tag.CONFIRMED{background:#e3f8ef;color:var(--green)}.tag.DRAFT,.tag.PENDING{background:#fff2d8;color:var(--amber)}.tag.EXCLUDED,.tag.LEGACY{background:#f1f3f5;color:#59636e}.metrics{display:grid;grid-template-columns:repeat(5,minmax(90px,1fr));gap:8px;margin:14px 0}.metric{background:var(--soft);border-radius:7px;padding:9px 10px}.metric b{display:block;font-size:18px;color:var(--navy)}.metric span{font-size:11px;color:var(--muted)}details>summary{cursor:pointer;color:var(--blue);font-size:13px;margin-top:10px}.rules{display:grid;gap:10px;margin-top:12px}.rule{border:1px solid var(--line);border-radius:8px;padding:12px}.rule-head{display:grid;grid-template-columns:minmax(0,1fr) 150px 120px;gap:8px;align-items:center}.rule-title{font-weight:650}.rule textarea{margin-top:9px}.rule-meta{font-size:11px;color:var(--muted);margin-top:6px}.review-hint{margin-top:12px;padding:9px 11px;border-left:3px solid var(--amber);background:#fff8e8;color:#75510b;font-size:12px}.snapshot{white-space:pre-wrap;background:var(--soft);border:1px solid #e6edf4;border-radius:7px;padding:10px;max-height:260px;overflow:auto;font-size:12px}.empty{text-align:center;padding:38px;color:var(--muted)}.message{min-height:20px;margin-top:10px}.error{color:var(--red)}@media(max-width:760px){.shell{padding:14px 10px 28px}.hero{align-items:flex-start;flex-direction:column;padding:24px 20px}.link{width:100%;text-align:center}.workspace{grid-template-columns:1fr}.config-panel{position:static}.filters,.rule-head{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.version-head{align-items:flex-start;flex-direction:column}}
 </style><style>.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:28px;border-radius:10px;padding:22px 26px;margin-bottom:18px;box-shadow:0 8px 22px rgba(16,42,67,.16)}.hero-copy{max-width:760px}.hero h1{font-size:25px}.hero .eyebrow{margin-bottom:5px}.hero .sub{margin-top:6px;max-width:680px}.hero-tools{display:flex;align-items:center;justify-content:flex-end;gap:9px}.hero .link{display:inline-flex;align-items:center;justify-content:center;height:36px;border-color:#557189;border-radius:6px;padding:0 12px;font-size:12px;font-weight:600}.hero .link:hover{background:rgba(255,255,255,.07)}@media(max-width:760px){.hero{grid-template-columns:1fr;gap:17px;padding:20px;margin-bottom:16px}.hero h1{font-size:24px}.hero-tools{display:grid;grid-template-columns:1fr;width:100%;gap:8px}.hero .link{width:100%}}</style></head><body><main class="shell"><header class="hero"><div class="hero-copy"><div class="eyebrow">Forge · training summaries</div><h1>Skill 汇总管理</h1><div class="sub">逐条审核 AI 生成规则；所有规则处理完成后，版本才能用于 Overlay。</div></div><div class="hero-tools"><a class="link" href="/">返回审核页</a><a class="link" href="/overlays">Overlay 管理</a></div></header><div class="workspace"><section><section class="panel"><div class="filters"><select id="project"><option value="">全部项目</option></select><select id="skill"><option value="">全部 Skill</option></select><button id="refresh">刷新版本</button></div><div id="message" class="message sub"></div></section><div id="versions" class="versions"></div></section><aside class="panel config-panel"><h2>LLM Summary 与评测配置</h2><div class="sub">用于生成 AI Summary，以及 Overlay 自动评测与发布。</div><div class="config-fields"><input id="llm-endpoint" placeholder="API 基础地址，例如 https://example.com/v1"><input id="llm-model" placeholder="模型名称"><select id="llm-wire-api"><option value="responses">Responses API</option><option value="chat_completions">Chat Completions API</option></select><input id="llm-key-env" placeholder="API Key 环境变量名"><div class="switch-row"><span>启用 LLM Summary 与评测</span><label class="switch" title="启用或停用 LLM Summary 与评测"><input type="checkbox" id="llm-enabled"><span class="slider"></span></label></div><button id="llm-save">保存配置</button><div id="llm-status" class="sub"></div></div></aside></div></main><script>
const $=id=>document.getElementById(id);let projects=[],values=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const text=v=>typeof v==='string'?v:JSON.stringify(v,null,2);
let versionLoadSequence=0;
async function load(){
  let project=$('project').value,skill=$('skill').value,sequence=++versionLoadSequence;
  let current=()=>sequence===versionLoadSequence&&project===$('project').value&&skill===$('skill').value;
  try{
    let [projectResponse,response]=await Promise.all([fetch('/api/projects'),fetch('/api/summaries?'+new URLSearchParams({project,skill,limit:'200',details:'1'}))]);
    let p=await projectResponse.json(),result=await response.json();
    if(!current())return;
    if(!projectResponse.ok)throw new Error(p.error||'无法加载项目');
    if(!response.ok)throw new Error(result.error||'无法加载版本');
    projects=p;values=result;
    $('project').innerHTML='<option value="">全部项目</option>'+projects.map(x=>`<option value="${esc(x.projectId)}">${esc(x.name)} [${esc(x.status)}]</option>`).join('');$('project').value=project;
    let skills=[...new Set(values.map(x=>x.skill))].sort();$('skill').innerHTML='<option value="">全部 Skill</option>'+skills.map(x=>`<option>${esc(x)}</option>`).join('');$('skill').value=skill;
    render();
  }catch(e){if(current())show(e.message,true)}
}
function metrics(s){let x=s?.statistics||{},c=s?.coverage||{},d=c.recordDecisions||{};return `<div class="metrics"><div class="metric"><b>${x.eligibleRecords??c.sourceRecords??s?.sourceCount??'-'}</b><span>合格记录</span></div><div class="metric"><b>${x.originalFindings??c.processedRecords??'-'}</b><span>已处理证据</span></div><div class="metric"><b>${x.candidateClusters??c.mapCandidates??'-'}</b><span>候选主题</span></div><div class="metric"><b>${x.generatedRules??c.finalRules??'-'}</b><span>候选规则</span></div><div class="metric"><b>${x.discardedClusters??((d.DISCARD||0)+(d.NO_LEARNING||0))}</b><span>未采纳证据</span></div></div>`}
function ruleEditor(rule,locked){let sourceSuffix=rule.sourceIdsTruncated?'（仅展示前 20 条，完整关系已入库）':'';let en=window.ForgeI18n?.language==='en';let detail=rule.trigger?`<div class="rule-meta">${en?'When':'适用时机'}：${esc(rule.trigger)}</div><div class="rule-meta">${en?'Verify':'如何校验'}：${esc(rule.verification)}</div>${rule.antiPattern?`<div class="rule-meta">${en?'Avoid':'避免'}：${esc(rule.antiPattern)}</div>`:''}`:'';return `<div class="rule" data-rule-id="${esc(rule.id)}"><div class="rule-head"><div><div class="rule-title">${esc(rule.title)}</div><div class="rule-meta">${rule.supportCount} 条证据${sourceSuffix} · ${esc((rule.sourceRecordIds||[]).join(', '))}</div></div><select data-field="stage" ${locked?'disabled':''}><option value="PRE_CHECK" ${rule.stage==='PRE_CHECK'?'selected':''}>执行前检查</option><option value="FINAL_VALIDATION" ${rule.stage==='FINAL_VALIDATION'?'selected':''}>输出前校验</option></select><select data-field="status" ${locked?'disabled':''}><option value="PENDING" ${rule.status==='PENDING'?'selected':''}>待审核</option><option value="CONFIRMED" ${rule.status==='CONFIRMED'?'selected':''}>确认采用</option><option value="EXCLUDED" ${rule.status==='EXCLUDED'?'selected':''}>排除</option></select></div>${detail}<textarea data-field="instruction" ${locked?'disabled':''}>${esc(rule.instruction)}</textarea>${rule.rationale?`<div class="rule-meta">依据：${esc(rule.rationale)}</div>`:''}</div>`}
function decisionPanel(s){
  if(s?.format==='forge-skill-training-summary-v6')return `<details data-decisions><summary>${window.ForgeI18n?.language==='en'?'Decisions at every stage':'查看各阶段判定'}</summary><div class="rules sub" data-decisions-content>加载中...</div></details><details data-evidence><summary>查看来源证据</summary><div class="rules sub" data-evidence-content>加载中...</div></details>`;
  if(!Array.isArray(s?.candidateDecisions))return '';
  return `<details><summary>候选判定 (${s.candidateDecisions.length})</summary><div class="rules">${decisionRows(s.candidateDecisions)}</div></details><details data-evidence><summary>查看来源证据</summary><div class="rules sub" data-evidence-content>加载中...</div></details>`;
}
function decisionRows(decisions){
  let en=window.ForgeI18n?.language==='en',labels=en?{KEEP:'Keep',DISCARD:'Discard',CONFLICT:'Conflict',NO_LEARNING:'No learning'}:{KEEP:'保留',DISCARD:'丢弃',CONFLICT:'冲突',NO_LEARNING:'无可学习内容'};
  return decisions.map(d=>`<div class="rule"><b>${esc(labels[d.decision]||d.decision)}</b> · ${esc(d.phase||'FINAL')} ${Number.isInteger(d.level)?esc(d.level):''} · ${esc(d.inputId||d.candidateId)}<div class="rule-meta">${esc(d.reason)}</div><div class="rule-meta">${esc((d.sourceRecordIds||[]).join(', '))}</div></div>`).join('');
}
async function loadDecisions(details,page=1){
  if(!details.open||details.dataset.loading||(page===1&&details.dataset.loaded))return;
  details.dataset.loading='1';
  const card=details.closest('.version'),container=details.querySelector('[data-decisions-content]');
  try{
    const response=await fetch('/api/summary-decisions?'+new URLSearchParams({project:card.dataset.project,skill:card.dataset.skill,version:card.dataset.version,page:String(page),limit:'20'})),result=await response.json();
    if(!response.ok)throw new Error(result.error||'无法加载判定');
    const rows=decisionRows(result.decisions);
    container.querySelector('[data-decisions-more]')?.remove();
    if(page===1)container.innerHTML=rows||`<div class="sub">${window.ForgeI18n?.language==='en'?'No decisions':'没有判定记录'}</div>`;
    else container.insertAdjacentHTML('beforeend',rows);
    details.dataset.loaded='1';
    if(result.hasMore){
      const label=window.ForgeI18n?.language==='en'?`Load more (${result.page*result.pageSize}/${result.total})`:`继续加载（${result.page*result.pageSize}/${result.total}）`;
      container.insertAdjacentHTML('beforeend',`<button class="secondary" data-decisions-more>${esc(label)}</button>`);
      container.querySelector('[data-decisions-more]').onclick=()=>loadDecisions(details,result.page+1);
    }
  }catch(error){
    if(page===1){container.textContent=error.message;delete details.dataset.loaded}
    else{const button=container.querySelector('[data-decisions-more]');if(button)button.textContent=error.message}
  }finally{delete details.dataset.loading}
}
function versionCard(v){let s=v.summary,modern=['forge-skill-training-summary-v5','forge-skill-training-summary-v6'].includes(s?.format),ai=s?.format==='forge-skill-training-summary-v6',state=modern?(v.lifecycle_status||s.status):'LEGACY',locked=state==='ARCHIVED',rules=modern&&Array.isArray(s.rules)?s.rules:[],pending=rules.filter(r=>r.status==='PENDING').length,confirmed=rules.some(r=>r.status==='CONFIRMED'),en=window.ForgeI18n?.language==='en';let name=projects.find(x=>x.projectId===v.project_id)?.name||v.project_id;let body=modern?`${metrics(s)}${state==='REVIEWED'?`<div class="review-hint">${en?'Review complete. Rules are read-only; generate a new Summary version to revise them.':'审核已完成，规则为只读；如需修订，请生成新的 Summary 版本。'}</div>`:''}${state==='DRAFT'?'<div class="review-hint">逐条将规则设为“确认采用”或“排除”；没有待审核规则后即可完成 Summary 审核。</div>':''}<details open><summary>审核 ${rules.length} 条 AI 规则</summary><div class="rules">${rules.map(r=>ruleEditor(r,locked||state==='REVIEWED')).join('')}</div></details>${decisionPanel(s)}`:`<details><summary>查看旧版完整快照</summary><div class="snapshot">${esc(text(s))}</div></details>`;let selection=ai&&state==='REVIEWED'&&confirmed?'<label class="summary-select"><input type="radio" name="overlay-summary" data-overlay-select> 选择用于 Overlay</label>':'';let saveLabel=pending?`保存审核进度（剩余 ${pending} 条）`:'完成 Summary 审核';let reviewedNote=ai?(confirmed?'已完成审核，可作为项目 Overlay 的唯一来源':(en?'Review complete; no rules were confirmed':'已完成审核，没有确认规则')):'历史 Summary 仅供查看';let actions=locked?'<span class="sub">历史汇总不可编辑或删除</span>':`${modern&&state==='DRAFT'?`<button data-save>${saveLabel}</button>`:''}<button class="danger" data-delete>删除</button><span class="sub">${state==='REVIEWED'?reviewedNote:'完成审核后可选择用于 Overlay'}</span>`;let windowDescription=s.window?` · 窗口 ${s.window.months} 个月${Number.isInteger(s.window.classicRecords)?`，经典 ${s.window.classicRecords} 条`:''}`:'';return `<article class="version" data-project="${esc(v.project_id)}" data-skill="${esc(v.skill)}" data-version="${v.version}"><div class="version-head"><div>${selection}<span class="version-title">${esc(name)} · ${esc(v.skill)} · v${v.version}</span> <span class="tag ${esc(state)}">${esc(state)}</span></div><div class="actions">${actions}</div></div><div class="sub">${v.source_count} 条来源记录 · ${esc(v.created_at)}${windowDescription}</div>${body}</article>`}
function syncReviewAction(card){let button=card.querySelector('[data-save]');if(!button)return;let pending=[...card.querySelectorAll('[data-field=status]')].filter(select=>select.value==='PENDING').length;button.textContent=pending?`保存审核进度（剩余 ${pending} 条）`:'完成 Summary 审核'}
function render(){$('versions').innerHTML=values.length?values.map(versionCard).join(''):'<div class="version empty">暂无汇总版本</div>';$('message').textContent=`${values.length} 个汇总版本`;$('message').className='message sub';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(b.closest('.version')));document.querySelectorAll('[data-field=status]').forEach(select=>select.onchange=()=>syncReviewAction(select.closest('.version')));document.querySelectorAll('[data-overlay-select]').forEach(input=>input.onchange=syncOverlayButton);document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeVersion(b.closest('.version')));document.querySelectorAll('[data-evidence]').forEach(d=>d.ontoggle=()=>loadEvidence(d));document.querySelectorAll('[data-decisions]').forEach(d=>d.ontoggle=()=>loadDecisions(d));syncOverlayButton()}
function evidenceRows(records){return records.map(r=>`<div class="rule"><b>${esc(r.recordId)}</b> · ${esc(r.capturedAt)}${r.reviewNote?`<div class="rule-meta">${esc(r.reviewNote)}</div>`:''}<pre class="snapshot">${esc(text(r.effectiveContent))}</pre></div>`).join('')}
async function loadEvidence(details,page=1){
  const lastPage=Number(details.dataset.evidencePage||0);
  if(!details.open||details.dataset.loading||page!==lastPage+1)return;
  const card=details.closest('.version'),container=details.querySelector('[data-evidence-content]'),more=container.querySelector('[data-evidence-more]');
  details.dataset.loading='1';
  if(more)more.disabled=true;
  try{
    const response=await fetch('/api/summary-evidence?'+new URLSearchParams({project:card.dataset.project,skill:card.dataset.skill,version:card.dataset.version,page:String(page),limit:'20'})),result=await response.json();
    if(!response.ok)throw new Error(result.error||'无法加载证据');
    const rows=evidenceRows(result.records);
    more?.remove();
    if(page===1)container.innerHTML=rows||'<div class="sub">没有关联的候选证据</div>';
    else container.insertAdjacentHTML('beforeend',rows);
    details.dataset.loaded='1';
    details.dataset.evidencePage=String(page);
    if(result.hasMore){
      const loaded=result.records.length+((page-1)*result.pageSize),label=window.ForgeI18n?.language==='en'?`Load more (${loaded}/${result.total})`:`继续加载（${loaded}/${result.total}）`;
      container.insertAdjacentHTML('beforeend',`<button class="secondary" data-evidence-more>${esc(label)}</button>`);
      container.querySelector('[data-evidence-more]').onclick=()=>loadEvidence(details,page+1);
    }
  }catch(error){
    if(page===1){container.textContent=error.message;delete details.dataset.loaded}
    else if(more)more.textContent=error.message+(window.ForgeI18n?.language==='en'?' — Retry':' · 点击重试');
  }finally{
    delete details.dataset.loading;
    if(more)more.disabled=false;
  }
}
 async function loadLlm(){let response=await fetch('/api/llm-config');let c=await response.json();$('llm-enabled').checked=Boolean(c.enabled);$('llm-endpoint').value=c.baseUrl||'';$('llm-model').value=c.model||'';$('llm-wire-api').value=c.wireApi||'responses';$('llm-key-env').value=c.apiKeyEnv||'FORGE_LEARNING_LLM_API_KEY';$('llm-status').textContent=(c.configured?'LLM 配置已就绪':'LLM 未配置或未启用')+(c.requestUrl?` · ${c.requestUrl}`:'')}
function identity(card){return {projectId:card.dataset.project,skill:card.dataset.skill,version:Number(card.dataset.version)}}
async function save(card){let rules=[...card.querySelectorAll('[data-rule-id]')].map(r=>({id:r.dataset.ruleId,stage:r.querySelector('[data-field=stage]').value,status:r.querySelector('[data-field=status]').value,instruction:r.querySelector('[data-field=instruction]').value}));await post('/api/review-summary',{...identity(card),rules},'审核保存失败')}
async function removeVersion(card){if(confirm('确认物理删除此汇总版本？删除后无法恢复。'))await post('/api/delete-summary',identity(card),'删除失败')}
async function post(url,payload,fallback){let response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),value=await response.json();if(!response.ok){show(value.error||fallback,true);return}await load()}
function show(value,error=false){$('message').textContent=value;$('message').className=error?'message error':'message sub'}
$('project').onchange=load;$('skill').onchange=load;$('refresh').onclick=load;load();
 async function saveLlm(){let response=await fetch('/api/llm-config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:$('llm-enabled').checked,baseUrl:$('llm-endpoint').value.trim(),model:$('llm-model').value.trim(),wireApi:$('llm-wire-api').value,apiKeyEnv:$('llm-key-env').value.trim()})});let value=await response.json();if(response.ok)$('llm-endpoint').value=value.baseUrl||'';$('llm-status').textContent=!response.ok?(value.error||'LLM 配置保存失败'):((value.configured?'LLM 配置已就绪':'LLM 配置已保存；请设置对应的用户级环境变量')+(value.requestUrl?` · ${value.requestUrl}`:''));$('llm-status').className=response.ok?'sub':'sub error'}
$('llm-save').onclick=saveLlm;$('llm-enabled').onchange=saveLlm;loadLlm();
</script><script>
const overlayButton=document.createElement('button');overlayButton.id='create-overlay';overlayButton.textContent='生成 Overlay 草稿';overlayButton.disabled=true;overlayButton.title='请选择一个已审核的 AI Summary v6';document.querySelector('.filters').appendChild(overlayButton);
function syncOverlayButton(){let selected=document.querySelectorAll('[data-overlay-select]:checked').length,english=window.ForgeI18n?.language==='en';overlayButton.disabled=selected!==1;overlayButton.title=selected===1?(english?'Create an Overlay draft from this AI Summary':'使用此 AI Summary 生成 Overlay 草稿'):(english?'Select one reviewed AI Summary v6':'请选择一个已审核的 AI Summary v6')}
