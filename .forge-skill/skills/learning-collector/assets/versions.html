<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skill 汇总版本管理</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#172033;background:#edf2f7;--navy:#102a43;--blue:#1769aa;--muted:#6b7c93;--line:#dce5ee;--soft:#f6f9fc;--green:#087f5b;--amber:#b45309;--red:#b42318}*{box-sizing:border-box}body{margin:0}.shell{max-width:1320px;margin:auto;padding:28px 32px 48px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;background:var(--navy);color:#fff;border-radius:16px;padding:30px 34px;margin-bottom:20px;box-shadow:0 10px 28px rgba(16,42,67,.2)}h1{font-size:28px;margin:0}.eyebrow{font-size:12px;letter-spacing:1.5px;color:#a9d8ee;margin-bottom:7px}.sub{font-size:13px;color:var(--muted)}.hero .sub{color:#c4d4e2;margin-top:7px}.link{color:#fff;text-decoration:none;border:1px solid #6f94af;border-radius:8px;padding:8px 12px;font-size:13px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:start}.panel,.version{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 3px 12px rgba(16,42,67,.05)}.panel{padding:18px 20px}.config-panel{position:sticky;top:18px}.config-panel h2{font-size:16px;margin:0 0 5px;color:var(--navy)}.config-fields{display:grid;gap:10px;margin-top:16px}.config-fields input{width:100%}.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}.switch{position:relative;width:42px;height:24px;flex:0 0 auto}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#c8d4e1;border-radius:999px;cursor:pointer;transition:.2s}.slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}.switch input:checked+.slider{background:var(--green)}.switch input:checked+.slider:before{transform:translateX(18px)}.filters{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}select,input,textarea,button{font:inherit;border:1px solid #c8d4e1;border-radius:7px;padding:8px 10px;background:#fff;color:#172033}textarea{width:100%;min-height:76px;resize:vertical}button{border:0;background:var(--blue);color:#fff;font-weight:600;cursor:pointer}.danger{background:var(--red)}.versions{display:grid;gap:14px;margin-top:16px}.version{padding:18px 20px}.version-head,.actions,.tags{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.version-head{justify-content:space-between}.version-title{font-size:16px;font-weight:750;color:var(--navy)}.tag{display:inline-flex;background:#edf3f8;color:#40566d;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:650}.tag.active,.tag.REVIEWED,.tag.CONFIRMED{background:#e3f8ef;color:var(--green)}.tag.DRAFT,.tag.PENDING{background:#fff2d8;color:var(--amber)}.tag.EXCLUDED,.tag.LEGACY{background:#f1f3f5;color:#59636e}.metrics{display:grid;grid-template-columns:repeat(5,minmax(90px,1fr));gap:8px;margin:14px 0}.metric{background:var(--soft);border-radius:7px;padding:9px 10px}.metric b{display:block;font-size:18px;color:var(--navy)}.metric span{font-size:11px;color:var(--muted)}details>summary{cursor:pointer;color:var(--blue);font-size:13px;margin-top:10px}.rules{display:grid;gap:10px;margin-top:12px}.rule{border:1px solid var(--line);border-radius:8px;padding:12px}.rule-head{display:grid;grid-template-columns:minmax(0,1fr) 150px 120px;gap:8px;align-items:center}.rule-title{font-weight:650}.rule textarea{margin-top:9px}.rule-meta{font-size:11px;color:var(--muted);margin-top:6px}.snapshot{white-space:pre-wrap;background:var(--soft);border:1px solid #e6edf4;border-radius:7px;padding:10px;max-height:260px;overflow:auto;font-size:12px}.empty{text-align:center;padding:38px;color:var(--muted)}.message{min-height:20px;margin-top:10px}.error{color:var(--red)}@media(max-width:760px){.shell{padding:14px 10px 28px}.hero{align-items:flex-start;flex-direction:column;padding:24px 20px}.link{width:100%;text-align:center}.workspace{grid-template-columns:1fr}.config-panel{position:static}.filters,.rule-head{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.version-head{align-items:flex-start;flex-direction:column}}
 </style></head><body><main class="shell"><header class="hero"><div><div class="eyebrow">Forge · training summaries</div><h1>Skill 汇总版本管理</h1><div class="sub">逐条审核精炼规则；所有规则处理完成后，版本才能启用。</div></div><a class="link" href="/">返回审核页</a></header><div class="workspace"><section><section class="panel"><div class="filters"><select id="project"><option value="">全部项目</option></select><select id="skill"><option value="">全部 Skill</option></select><button id="refresh">刷新版本</button></div><div id="message" class="message sub"></div></section><div id="versions" class="versions"></div></section><aside class="panel config-panel"><h2>LLM 精炼配置</h2><div class="sub">仅在点击版本上的“LLM 精炼”时调用。</div><div class="config-fields"><input id="llm-endpoint" placeholder="OpenAI-compatible endpoint"><input id="llm-model" placeholder="模型名称"><select id="llm-wire-api"><option value="responses">Responses API</option><option value="chat_completions">Chat Completions API</option></select><input id="llm-key-env" placeholder="API Key 环境变量名"><div class="switch-row"><span>启用 LLM 精炼</span><label class="switch" title="启用或停用 LLM 精炼"><input type="checkbox" id="llm-enabled"><span class="slider"></span></label></div><button id="llm-save">保存配置</button><div id="llm-status" class="sub"></div></div></aside></div></main><script>
const $=id=>document.getElementById(id);let projects=[],values=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const text=v=>typeof v==='string'?v:JSON.stringify(v,null,2);
async function load(){try{let project=$('project').value,skill=$('skill').value;let [p,response]=await Promise.all([fetch('/api/projects').then(r=>r.json()),fetch('/api/summaries?'+new URLSearchParams({project,skill,limit:'200',details:'1'}))]);let result=await response.json();if(!response.ok)throw new Error(result.error||'无法加载版本');projects=p;values=result;$('project').innerHTML='<option value="">全部项目</option>'+projects.map(x=>`<option value="${esc(x.projectId)}">${esc(x.name)} [${esc(x.status)}]</option>`).join('');$('project').value=project;let skills=[...new Set(values.map(x=>x.skill))].sort();$('skill').innerHTML='<option value="">全部 Skill</option>'+skills.map(x=>`<option>${esc(x)}</option>`).join('');$('skill').value=skill;render()}catch(e){show(e.message,true)}}
function metrics(s){let x=s?.statistics||{};return `<div class="metrics"><div class="metric"><b>${x.eligibleRecords??s?.sourceCount??'-'}</b><span>合格记录</span></div><div class="metric"><b>${x.originalFindings??'-'}</b><span>原始问题</span></div><div class="metric"><b>${x.candidateClusters??'-'}</b><span>候选主题</span></div><div class="metric"><b>${x.generatedRules??'-'}</b><span>候选规则</span></div><div class="metric"><b>${x.discardedClusters??'-'}</b><span>已压缩主题</span></div></div>`}
function ruleEditor(rule,locked){let sourceSuffix=rule.sourceIdsTruncated?'（仅展示前 20 条，完整关系已入库）':'';return `<div class="rule" data-rule-id="${esc(rule.id)}"><div class="rule-head"><div><div class="rule-title">${esc(rule.title)}</div><div class="rule-meta">${rule.supportCount} 条证据${sourceSuffix} · ${esc((rule.sourceRecordIds||[]).join(', '))}</div></div><select data-field="stage" ${locked?'disabled':''}><option ${rule.stage==='PRE_CHECK'?'selected':''}>PRE_CHECK</option><option ${rule.stage==='FINAL_VALIDATION'?'selected':''}>FINAL_VALIDATION</option></select><select data-field="status" ${locked?'disabled':''}><option ${rule.status==='PENDING'?'selected':''}>PENDING</option><option ${rule.status==='CONFIRMED'?'selected':''}>CONFIRMED</option><option ${rule.status==='EXCLUDED'?'selected':''}>EXCLUDED</option></select></div><textarea data-field="instruction" ${locked?'disabled':''}>${esc(rule.instruction)}</textarea>${rule.rationale?`<div class="rule-meta">依据：${esc(rule.rationale)}</div>`:''}</div>`}
function versionCard(v){let s=v.summary,modern=['forge-skill-training-summary-v4','forge-skill-training-summary-v5'].includes(s?.format),state=v.applied?'ENABLED':modern?s.status:'LEGACY',locked=Boolean(v.applied);let name=projects.find(x=>x.projectId===v.project_id)?.name||v.project_id;let body=modern?`${metrics(s)}<details open><summary>审核 ${s.rules.length} 条精炼规则</summary><div class="rules">${s.rules.map(r=>ruleEditor(r,locked)).join('')}</div></details>`:`<details><summary>查看旧版完整快照</summary><div class="snapshot">${esc(text(s))}</div></details>`;let actions=v.applied?'<span class="sub">当前启用版本不可编辑或删除</span>':`${modern?'<button data-save>保存审核</button>':''}${modern&&s.status==='DRAFT'?'<button data-refine>LLM 精炼</button>':''}${modern&&s.status==='REVIEWED'?'<button data-apply>启用</button>':''}<button class="danger" data-delete>删除</button>`;return `<article class="version" data-project="${esc(v.project_id)}" data-skill="${esc(v.skill)}" data-version="${v.version}"><div class="version-head"><div><span class="version-title">${esc(name)} · ${esc(v.skill)} · v${v.version}</span> <span class="tag ${esc(state)}">${esc(state)}</span></div><div class="actions">${actions}</div></div><div class="sub">${v.source_count} 条来源记录 · ${esc(v.created_at)}${s.window?` · 窗口 ${s.window.months} 个月，经典 ${s.window.classicRecords} 条`:''}</div>${body}</article>`}
function render(){$('versions').innerHTML=values.length?values.map(versionCard).join(''):'<div class="version empty">暂无汇总版本</div>';$('message').textContent=`${values.length} 个汇总版本`;$('message').className='message sub';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(b.closest('.version')));document.querySelectorAll('[data-refine]').forEach(b=>b.onclick=()=>refine(b.closest('.version')));document.querySelectorAll('[data-apply]').forEach(b=>b.onclick=()=>apply(b.closest('.version')));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeVersion(b.closest('.version')))}
async function refine(card){if(!confirm('确认调用已配置的 LLM 精炼此 DRAFT？'))return;await post('/api/refine',identity(card),'LLM 精炼失败')}
 async function loadLlm(){let response=await fetch('/api/llm-config');let c=await response.json();$('llm-enabled').checked=Boolean(c.enabled);$('llm-endpoint').value=c.endpoint||'';$('llm-model').value=c.model||'';$('llm-wire-api').value=c.wireApi||'responses';$('llm-key-env').value=c.apiKeyEnv||'FORGE_LEARNING_LLM_API_KEY';$('llm-status').textContent=c.configured?'LLM 配置已就绪':'LLM 未配置或未启用'}
function identity(card){return {projectId:card.dataset.project,skill:card.dataset.skill,version:Number(card.dataset.version)}}
async function save(card){let rules=[...card.querySelectorAll('[data-rule-id]')].map(r=>({id:r.dataset.ruleId,stage:r.querySelector('[data-field=stage]').value,status:r.querySelector('[data-field=status]').value,instruction:r.querySelector('[data-field=instruction]').value}));await post('/api/review-summary',{...identity(card),rules},'审核保存失败')}
async function apply(card){if(confirm('确认启用此版本？同一项目和 Skill 的其他版本将停用。'))await post('/api/apply',identity(card),'启用失败')}
async function removeVersion(card){if(confirm('确认物理删除此汇总版本？删除后无法恢复。'))await post('/api/delete-summary',identity(card),'删除失败')}
async function post(url,payload,fallback){let response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),value=await response.json();if(!response.ok){show(value.error||fallback,true);return}await load()}
function show(value,error=false){$('message').textContent=value;$('message').className=error?'message error':'message sub'}
$('project').onchange=load;$('skill').onchange=load;$('refresh').onclick=load;load();
 async function saveLlm(){let response=await fetch('/api/llm-config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:$('llm-enabled').checked,endpoint:$('llm-endpoint').value.trim(),model:$('llm-model').value.trim(),wireApi:$('llm-wire-api').value,apiKeyEnv:$('llm-key-env').value.trim()})});let value=await response.json();$('llm-status').textContent=!response.ok?(value.error||'LLM 配置保存失败'):value.configured?'LLM 配置已就绪':'LLM 配置已保存；请设置对应的用户级环境变量';$('llm-status').className=response.ok?'sub':'sub error'}
$('llm-save').onclick=saveLlm;$('llm-enabled').onchange=saveLlm;loadLlm();
</script></body></html>
