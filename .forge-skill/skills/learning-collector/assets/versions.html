<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skill 汇总版本管理</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#172033;background:#edf2f7;--navy:#102a43;--blue:#1769aa;--muted:#6b7c93;--line:#dce5ee;--soft:#f6f9fc;--green:#087f5b;--amber:#b45309;--red:#b42318}*{box-sizing:border-box}body{margin:0}.shell{max-width:1320px;margin:auto;padding:28px 32px 48px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;background:var(--navy);color:#fff;border-radius:16px;padding:30px 34px;margin-bottom:20px;box-shadow:0 10px 28px rgba(16,42,67,.2)}h1{font-size:28px;margin:0}.eyebrow{font-size:12px;letter-spacing:1.5px;color:#a9d8ee;margin-bottom:7px}.sub{font-size:13px;color:var(--muted)}.hero .sub{color:#c4d4e2;margin-top:7px}.link{color:#fff;text-decoration:none;border:1px solid #6f94af;border-radius:8px;padding:8px 12px;font-size:13px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:start}.panel,.version{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 3px 12px rgba(16,42,67,.05)}.panel{padding:18px 20px}.config-panel{position:sticky;top:18px}.config-panel h2{font-size:16px;margin:0 0 5px;color:var(--navy)}.config-fields{display:grid;gap:10px;margin-top:16px}.config-fields input{width:100%}.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}.switch{position:relative;width:42px;height:24px;flex:0 0 auto}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#c8d4e1;border-radius:999px;cursor:pointer;transition:.2s}.slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}.switch input:checked+.slider{background:var(--green)}.switch input:checked+.slider:before{transform:translateX(18px)}.filters{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}select,input,textarea,button{font:inherit;border:1px solid #c8d4e1;border-radius:7px;padding:8px 10px;background:#fff;color:#172033}textarea{width:100%;min-height:76px;resize:vertical}button{border:0;background:var(--blue);color:#fff;font-weight:600;cursor:pointer}.danger{background:var(--red)}.versions{display:grid;gap:14px;margin-top:16px}.version{padding:18px 20px}.version-head,.actions,.tags{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.version-head{justify-content:space-between}.version-title{font-size:16px;font-weight:750;color:var(--navy)}.tag{display:inline-flex;background:#edf3f8;color:#40566d;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:650}.tag.active,.tag.REVIEWED,.tag.CONFIRMED{background:#e3f8ef;color:var(--green)}.tag.DRAFT,.tag.PENDING{background:#fff2d8;color:var(--amber)}.tag.EXCLUDED,.tag.LEGACY{background:#f1f3f5;color:#59636e}.metrics{display:grid;grid-template-columns:repeat(5,minmax(90px,1fr));gap:8px;margin:14px 0}.metric{background:var(--soft);border-radius:7px;padding:9px 10px}.metric b{display:block;font-size:18px;color:var(--navy)}.metric span{font-size:11px;color:var(--muted)}details>summary{cursor:pointer;color:var(--blue);font-size:13px;margin-top:10px}.rules{display:grid;gap:10px;margin-top:12px}.rule{border:1px solid var(--line);border-radius:8px;padding:12px}.rule-head{display:grid;grid-template-columns:minmax(0,1fr) 150px 120px;gap:8px;align-items:center}.rule-title{font-weight:650}.rule textarea{margin-top:9px}.rule-meta{font-size:11px;color:var(--muted);margin-top:6px}.snapshot{white-space:pre-wrap;background:var(--soft);border:1px solid #e6edf4;border-radius:7px;padding:10px;max-height:260px;overflow:auto;font-size:12px}.empty{text-align:center;padding:38px;color:var(--muted)}.message{min-height:20px;margin-top:10px}.error{color:var(--red)}@media(max-width:760px){.shell{padding:14px 10px 28px}.hero{align-items:flex-start;flex-direction:column;padding:24px 20px}.link{width:100%;text-align:center}.workspace{grid-template-columns:1fr}.config-panel{position:static}.filters,.rule-head{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.version-head{align-items:flex-start;flex-direction:column}}
 </style></head><body><main class="shell"><header class="hero"><div><div class="eyebrow">Forge · training summaries</div><h1>Skill 汇总版本管理</h1><div class="sub">逐条审核精炼规则；所有规则处理完成后，版本才能启用。</div></div><a class="link" href="/">返回审核页</a></header><div class="workspace"><section><section class="panel"><div class="filters"><select id="project"><option value="">全部项目</option></select><select id="skill"><option value="">全部 Skill</option></select><button id="refresh">刷新版本</button></div><div id="message" class="message sub"></div></section><div id="versions" class="versions"></div></section><aside class="panel config-panel"><h2>LLM 精炼与评测配置</h2><div class="sub">仅在点击“LLM 精炼”或“自动评测并发布”时调用。</div><div class="config-fields"><input id="llm-endpoint" placeholder="OpenAI-compatible endpoint"><input id="llm-model" placeholder="模型名称"><select id="llm-wire-api"><option value="responses">Responses API</option><option value="chat_completions">Chat Completions API</option></select><input id="llm-key-env" placeholder="API Key 环境变量名"><div class="switch-row"><span>启用 LLM 精炼与评测</span><label class="switch" title="启用或停用 LLM 精炼与评测"><input type="checkbox" id="llm-enabled"><span class="slider"></span></label></div><button id="llm-save">保存配置</button><div id="llm-status" class="sub"></div></div></aside></div></main><script>
const $=id=>document.getElementById(id);let projects=[],values=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const text=v=>typeof v==='string'?v:JSON.stringify(v,null,2);
async function load(){try{let project=$('project').value,skill=$('skill').value;let [p,response]=await Promise.all([fetch('/api/projects').then(r=>r.json()),fetch('/api/summaries?'+new URLSearchParams({project,skill,limit:'200',details:'1'}))]);let result=await response.json();if(!response.ok)throw new Error(result.error||'无法加载版本');projects=p;values=result;$('project').innerHTML='<option value="">全部项目</option>'+projects.map(x=>`<option value="${esc(x.projectId)}">${esc(x.name)} [${esc(x.status)}]</option>`).join('');$('project').value=project;let skills=[...new Set(values.map(x=>x.skill))].sort();$('skill').innerHTML='<option value="">全部 Skill</option>'+skills.map(x=>`<option>${esc(x)}</option>`).join('');$('skill').value=skill;render()}catch(e){show(e.message,true)}}
function metrics(s){let x=s?.statistics||{};return `<div class="metrics"><div class="metric"><b>${x.eligibleRecords??s?.sourceCount??'-'}</b><span>合格记录</span></div><div class="metric"><b>${x.originalFindings??'-'}</b><span>原始问题</span></div><div class="metric"><b>${x.candidateClusters??'-'}</b><span>候选主题</span></div><div class="metric"><b>${x.generatedRules??'-'}</b><span>候选规则</span></div><div class="metric"><b>${x.discardedClusters??'-'}</b><span>已压缩主题</span></div></div>`}
function evaluationMeta(v){let b=v.evaluation?.behavior;if(b){if(b.error)return `<div class="sub error">评测失败：${esc(b.error)}</div>`;let gates=(b.gates||[]).map(g=>`${g.passed?'通过':'失败'} ${g.id}`).join(' · ');return `<div class="sub">LLM 评测 ${b.caseCount} 个固定案例 · 置信度 ${esc(b.confidence)} · ${esc(gates)}</div>`}let r=v.evaluationReadiness;if(!r)return '';return r.ready?`<div class="sub">评测案例已就绪 ${r.caseCount}/${r.requiredCaseCount} · ${esc((r.categories||[]).join('、'))}</div>`:`<div class="sub error">评测案例不足 ${r.caseCount}/${r.requiredCaseCount}${r.error?` · ${esc(r.error)}`:''}</div>`}
function ruleEditor(rule,locked){let sourceSuffix=rule.sourceIdsTruncated?'（仅展示前 20 条，完整关系已入库）':'';return `<div class="rule" data-rule-id="${esc(rule.id)}"><div class="rule-head"><div><div class="rule-title">${esc(rule.title)}</div><div class="rule-meta">${rule.supportCount} 条证据${sourceSuffix} · ${esc((rule.sourceRecordIds||[]).join(', '))}</div></div><select data-field="stage" ${locked?'disabled':''}><option ${rule.stage==='PRE_CHECK'?'selected':''}>PRE_CHECK</option><option ${rule.stage==='FINAL_VALIDATION'?'selected':''}>FINAL_VALIDATION</option></select><select data-field="status" ${locked?'disabled':''}><option ${rule.status==='PENDING'?'selected':''}>PENDING</option><option ${rule.status==='CONFIRMED'?'selected':''}>CONFIRMED</option><option ${rule.status==='EXCLUDED'?'selected':''}>EXCLUDED</option></select></div><textarea data-field="instruction" ${locked?'disabled':''}>${esc(rule.instruction)}</textarea>${rule.rationale?`<div class="rule-meta">依据：${esc(rule.rationale)}</div>`:''}</div>`}
function versionCard(v){let s=v.summary,modern=s?.format==='forge-skill-training-summary-v5',state=modern?(v.lifecycle_status||s.status):'LEGACY',locked=state==='ARCHIVED';let name=projects.find(x=>x.projectId===v.project_id)?.name||v.project_id;let body=modern?`${metrics(s)}<details open><summary>审核 ${s.rules.length} 条精炼规则</summary><div class="rules">${s.rules.map(r=>ruleEditor(r,locked)).join('')}</div></details>`:`<details><summary>查看旧版完整快照</summary><div class="snapshot">${esc(text(s))}</div></details>`;let actions=locked?'<span class="sub">历史汇总不可编辑或删除</span>':`${modern?'<button data-save>保存审核</button>':''}${modern&&s.status==='DRAFT'?'<button data-refine>LLM 精炼</button>':''}<span class="sub">可作为项目 Overlay 的来源</span>`;return `<article class="version" data-project="${esc(v.project_id)}" data-skill="${esc(v.skill)}" data-version="${v.version}"><div class="version-head"><div><span class="version-title">${esc(name)} · ${esc(v.skill)} · v${v.version}</span> <span class="tag ${esc(state)}">${esc(state)}</span></div><div class="actions">${actions}</div></div><div class="sub">${v.source_count} 条来源记录 · ${esc(v.created_at)}${s.window?` · 窗口 ${s.window.months} 个月，经典 ${s.window.classicRecords} 条`:''}</div>${body}</article>`}
function render(){$('versions').innerHTML=values.length?values.map(versionCard).join(''):'<div class="version empty">暂无汇总版本</div>';$('message').textContent=`${values.length} 个汇总版本`;$('message').className='message sub';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(b.closest('.version')));document.querySelectorAll('[data-refine]').forEach(b=>b.onclick=()=>refine(b.closest('.version')));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeVersion(b.closest('.version')))}
async function refine(card){if(!confirm('确认调用已配置的 LLM，并基于此 DRAFT 创建一个新的精炼版本？原版本不会修改。'))return;await post('/api/refine',identity(card),'LLM 精炼失败')}
 async function loadLlm(){let response=await fetch('/api/llm-config');let c=await response.json();$('llm-enabled').checked=Boolean(c.enabled);$('llm-endpoint').value=c.endpoint||'';$('llm-model').value=c.model||'';$('llm-wire-api').value=c.wireApi||'responses';$('llm-key-env').value=c.apiKeyEnv||'FORGE_LEARNING_LLM_API_KEY';$('llm-status').textContent=c.configured?'LLM 配置已就绪':'LLM 未配置或未启用'}
function identity(card){return {projectId:card.dataset.project,skill:card.dataset.skill,version:Number(card.dataset.version)}}
async function save(card){let rules=[...card.querySelectorAll('[data-rule-id]')].map(r=>({id:r.dataset.ruleId,stage:r.querySelector('[data-field=stage]').value,status:r.querySelector('[data-field=status]').value,instruction:r.querySelector('[data-field=instruction]').value}));await post('/api/review-summary',{...identity(card),rules},'审核保存失败')}
async function removeVersion(card){if(confirm('确认物理删除此汇总版本？删除后无法恢复。'))await post('/api/delete-summary',identity(card),'删除失败')}
async function post(url,payload,fallback){let response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),value=await response.json();if(!response.ok){show(value.error||fallback,true);return}await load()}
function show(value,error=false){$('message').textContent=value;$('message').className=error?'message error':'message sub'}
$('project').onchange=load;$('skill').onchange=load;$('refresh').onclick=load;load();
 async function saveLlm(){let response=await fetch('/api/llm-config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:$('llm-enabled').checked,endpoint:$('llm-endpoint').value.trim(),model:$('llm-model').value.trim(),wireApi:$('llm-wire-api').value,apiKeyEnv:$('llm-key-env').value.trim()})});let value=await response.json();$('llm-status').textContent=!response.ok?(value.error||'LLM 配置保存失败'):value.configured?'LLM 配置已就绪':'LLM 配置已保存；请设置对应的用户级环境变量';$('llm-status').className=response.ok?'sub':'sub error'}
$('llm-save').onclick=saveLlm;$('llm-enabled').onchange=saveLlm;loadLlm();
</script><script>
const overlayButton=document.createElement('button');overlayButton.id='create-overlay';overlayButton.textContent='生成 Overlay 草稿';document.querySelector('.filters').appendChild(overlayButton);
const overlayObserver=new MutationObserver(()=>{document.querySelectorAll('.version').forEach(card=>{if(card.querySelector('[data-overlay-select]'))return;let tag=card.querySelector('.tag');if(tag?.textContent==='REVIEWED'){let label=document.createElement('label');label.innerHTML='<input type="checkbox" data-overlay-select> 选择';card.querySelector('.version-head>div').prepend(label)}})});overlayObserver.observe(document.getElementById('versions'),{childList:true,subtree:true});
document.getElementById('versions').appendChild(document.createComment('overlay-selectors-init'));
const overlayPanel=document.createElement('section');overlayPanel.className='panel';overlayPanel.style.marginTop='16px';overlayPanel.innerHTML='<h2>项目 Overlay</h2><div id="overlay-list" class="versions"></div>';document.querySelector('.workspace>section').appendChild(overlayPanel);
async function loadOverlays(){let project=$('project').value,skill=$('skill').value,list=$('overlay-list');if(!project||!skill){list.innerHTML='<div class="empty">请选择项目和 Skill 后管理 Overlay</div>';return}let response=await fetch('/api/overlays?'+new URLSearchParams({project,skill})),values=await response.json();if(!response.ok){list.innerHTML=`<div class="empty error">${esc(values.error||'Overlay 加载失败')}</div>`;return}list.innerHTML=values.length?values.map(v=>{let state=v.status==='REVIEWED'&&v.published_at?'PUBLISHED':v.status,ready=v.evaluationReadiness?.ready===true,evaluateTitle=ready?'使用固定案例自动评测并发布':`评测案例不足 ${v.evaluationReadiness?.caseCount??0}/${v.evaluationReadiness?.requiredCaseCount??3}`;return `<article class="version" data-overlay-id="${esc(v.id)}" data-project="${esc(v.project_id)}" data-skill="${esc(v.skill)}" data-has-evaluation="${v.evaluation?'true':'false'}"><div class="version-head"><div><b>Overlay v${v.version}</b> <span class="tag ${esc(state)}">${esc(state)}</span></div><div class="actions"><span class="sub">${v.sourceSummaryIds.length} 个 Summary 来源</span>${v.status==='DRAFT'?'<button data-overlay-review>审核</button>':''}${v.status==='REVIEWED'&&!v.published_at?`<button data-overlay-evaluate-publish title="${esc(evaluateTitle)}" ${ready?'':'disabled'}>${v.evaluation?'重新评测并发布':'自动评测并发布'}</button>`:''}${v.status==='REVIEWED'&&v.published_at?'<button data-overlay-activate>启用</button>':''}${v.status==='ACTIVE'?'<button data-overlay-disable>停用</button>':''}${v.status!=='ACTIVE'?'<button class="danger" data-overlay-delete>删除</button>':''}</div></div><div class="sub">${esc(v.created_at)} · ${esc(v.content_digest)}${v.published_at?` · 已发布 ${esc(v.published_at)}`:''}</div>${evaluationMeta(v)}<textarea data-overlay-content ${v.status==='ACTIVE'?'disabled':''}>${esc(v.content)}</textarea></article>`}).join(''):'<div class="empty">暂无 Overlay</div>'}
overlayPanel.addEventListener('click',async event=>{let button=event.target.closest('button');if(!button)return;let card=button.closest('[data-overlay-id]'),payload={overlayId:card.dataset.overlayId,projectId:card.dataset.project,skill:card.dataset.skill},url,body=payload;if(button.hasAttribute('data-overlay-review')){url='/api/review-overlay';body={...payload,content:card.querySelector('[data-overlay-content]').value}}else if(button.hasAttribute('data-overlay-activate')){if(!confirm('确认启用此 Overlay？同一项目和 Skill 的其他 ACTIVE Overlay 将停用。'))return;url='/api/activate-overlay'}else if(button.hasAttribute('data-overlay-disable')){if(!confirm('确认停用此 Overlay？'))return;url='/api/disable-overlay'}else if(button.hasAttribute('data-overlay-delete')){if(!confirm('确认物理删除此 Overlay？删除后无法恢复。'))return;url='/api/delete-overlay'}else{return}let response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),value=await response.json();if(!response.ok){$('message').textContent=value.error||'Overlay 操作失败';$('message').className='message error';return}await loadOverlays()});$('project').addEventListener('change',loadOverlays);$('skill').addEventListener('change',loadOverlays);loadOverlays();
overlayButton.onclick=async()=>{let selected=[...document.querySelectorAll('[data-overlay-select]:checked')].map(input=>input.closest('.version'));let scopes=new Set(selected.map(card=>`${card.dataset.project}|${card.dataset.skill}`));if(scopes.size!==1){$('message').textContent='请选择同一项目和 Skill 下的已审核 Summary';$('message').className='message error';return}if(!selected.length){$('message').textContent='请至少选择一个已审核 Summary';$('message').className='message error';return}let [scope]=scopes,[projectId,skill]=scope.split('|'),summaryVersions=selected.map(card=>Number(card.dataset.version));let request=()=>fetch('/api/create-overlay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({projectId,skill,summaryVersions,replaceExisting:false})});let response=await request(),value=await response.json();if(response.status===409&&value.code==='OVERLAY_CONFLICT'&&value.replaceable&&confirm(`已存在相同来源的 Overlay 草稿 v${value.version}。是否替换并重新生成？`)){response=await fetch('/api/create-overlay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({projectId,skill,summaryVersions,replaceExisting:true})});value=await response.json()}$('message').textContent=response.ok?`已生成 Overlay 草稿 v${value.version}，等待审核`:(value.error||'Overlay 生成失败');$('message').className=response.ok?'message sub':'message error';if(response.ok)selected.forEach(card=>card.querySelector('[data-overlay-select]').checked=false)};
document.getElementById('overlay-list').addEventListener('click',async event=>{const button=event.target.closest('[data-overlay-evaluate-publish]');if(!button)return;const card=button.closest('[data-overlay-id]');if(!confirm('将使用固定案例分别运行 Baseline 和 Candidate，并调用 LLM 盲评。通过后发布但不会自动启用，是否继续？'))return;button.disabled=true;const payload={overlayId:card.dataset.overlayId,projectId:card.dataset.project,skill:card.dataset.skill,forceEvaluation:card.dataset.hasEvaluation==='true'};try{const response=await fetch('/api/evaluate-publish-overlay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const value=await response.json();let failed=value.evaluation?.behavior?.gates?.filter(g=>!g.passed).map(g=>g.id).join('、');$('message').textContent=response.ok?`自动评测通过，Overlay v${value.version} 已发布，未自动启用`:(value.error||failed&&`自动评测未通过：${failed}`||value.evaluation?.behavior?.error||'自动评测未通过');$('message').className=response.ok?'message sub':'message error';await loadOverlays()}finally{button.disabled=false}});</script></body></html>
