name: Quality Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-quality-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .claude/forge/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .claude/skills/page-test/package-lock.json
      - name: Install deterministic test dependencies
        run: python -m pip install -e ".claude/forge[dev]"
      - name: Install page-test library without browser downloads
        working-directory: .claude/skills/page-test
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Smoke-test Linux-compatible project installation and uninstall
        shell: bash
        run: |
          smoke_project="${RUNNER_TEMP}/forge-skill-install-smoke"
          mkdir -p "$smoke_project"
          python .claude/forge/scripts/sync-agent-skills.py --client codex --scope project --project "$smoke_project"
          python .claude/forge/scripts/sync-agent-skills.py --client codex --scope project --project "$smoke_project" --uninstall
      - name: Run full deterministic quality gate
        run: python .claude/forge/scripts/run-local-checks.py --full

  python-compatibility:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: .claude/forge/pyproject.toml
      - name: Install deterministic test dependencies
        run: python -m pip install -e ".claude/forge[dev]"
      - name: Verify Forge on the supported Python version
        run: python .claude/forge/scripts/run-local-checks.py --quick
      - name: Run Forge tests on the supported Python version
        run: python -m pytest .claude/forge/tests
