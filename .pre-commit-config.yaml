# Forge pre-commit hooks
# Install: pip install pre-commit && pre-commit install
#
# Commit-time checks use the fast, non-mutating gate. Run the same entry point
# without --quick for route regression, documentation facts, and pytest.

repos:
  - repo: local
    hooks:
      - id: forge-local-quality-gate
        name: Forge - quick commit quality gate
        entry: python .forge-skill/forge/scripts/run-local-checks.py --quick
        language: system
        files: ^(\.claude/(forge|skills)/|\.github/|README\.md$|\.gitignore$|\.pre-commit-config\.yaml$|.*\.(env|key|pem|p12|pfx|jks|keystore)$|(?:install-skills|install-link-forge|uninstall-link-forge)\.bat$)
        pass_filenames: false
